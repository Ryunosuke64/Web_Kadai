        /* ==========================================
           CSS: 画面のスタイリングと配置
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            margin: 0; padding: 0; color: #fff;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 38%, rgba(18, 52, 70, 0.38), transparent 40%),
                linear-gradient(135deg, #020409 0%, #07121b 50%, #020307 100%);
        }

        #game-container {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            max-width: 1920px;
            max-height: 1080px;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(85, 230, 255, 0.55);
            border-radius: 3px;
            background-color: #000;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.9),
                0 0 24px rgba(0, 210, 255, 0.22),
                0 0 90px rgba(0, 80, 120, 0.22),
                inset 0 0 45px rgba(0, 15, 25, 0.75);
        }

        #game-container::before {
            content: ""; position: absolute; inset: 0; z-index: 5;
            background:
                radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.54) 100%),
                linear-gradient(90deg, rgba(0, 210, 255, 0.04), transparent 12%, transparent 88%, rgba(0, 210, 255, 0.04));
            pointer-events: none;
        }

        #game-container::after {
            content: ""; position: absolute; inset: 0; z-index: 6;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        canvas {
            position: absolute; top: 0; left: 0;
            display: block; width: 100%; height: 100%;
        }
        #uiCanvas {
            pointer-events: none;
        }

        #guide {
            position: absolute; top: 12px; left: 18px; z-index: 8; color: #73ecff;
            font-size: clamp(9px, 0.68vw, 13px); letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 220, 255, 0.85);
            pointer-events: none;
        }
    </style>
</head>

        // これによりUIの縦横比を崩さず、16:9の左右にも3D画面を表示できる。
        const SCREEN_WIDTH = 1920;
        const SCREEN_HEIGHT = 1080;
        const UI_BASE_WIDTH = 800;
        const UI_BASE_HEIGHT = 600;
        const UI_SCALE = Math.min(SCREEN_WIDTH / UI_BASE_WIDTH, SCREEN_HEIGHT / UI_BASE_HEIGHT);
        const UI_OFFSET_X = (SCREEN_WIDTH - UI_BASE_WIDTH * UI_SCALE) * 0.5;
        const UI_OFFSET_Y = (SCREEN_HEIGHT - UI_BASE_HEIGHT * UI_SCALE) * 0.5;
        const UI_VIEW_LEFT = -UI_OFFSET_X / UI_SCALE;
        const UI_VIEW_TOP = -UI_OFFSET_Y / UI_SCALE;
        const UI_VIEW_WIDTH = SCREEN_WIDTH / UI_SCALE;
        const UI_VIEW_HEIGHT = SCREEN_HEIGHT / UI_SCALE;

        /* ============================================================================
           ▼▼▼ 武器パラメータ編集エリア ▼▼▼
        
           基本的には、この範囲だけ編集すれば武器性能を調整できます。
        
           【よく編集する項目】
           damage       : 1発（散弾は1粒）あたりのダメージ
           speed        : 弾速。大きいほど速い
           size         : 弾の大きさ・当たり判定サイズ
           maxAmmo      : 装弾数
           fireRate     : 次に撃てるまでの時間。SECONDS(0.2) = 0.2秒
           reloadTime   : リロード時間。SECONDS(2) = 2秒
           spread       : 弾の散らばり。0に近いほど正確
           count        : 散弾数、砲撃数など
           penetrate    : trueで敵を貫通
           bounces      : 壁で反射できる回数
           blastRadius  : 爆発半径
           knockback    : 敵の吹っ飛び強さ
           turnSpeed    : 誘導性能。大きいほど急旋回
        
           【時間の書き方】
           このゲームは内部では60FPS基準ですが、ここでは秒で指定できます。
           例: reloadTime: SECONDS(2.5)  → 2.5秒
        
           【色の書き方】
           0xRRGGBB形式です。例: 赤=0xFF0000、青=0x0088FF
        
           【武器追加用テンプレート】
           カテゴリ内の weapons: [ ... ] に、以下の形をコピーして追加できます。
        
           {
               name: '新しい武器',
               desc: '1行目の説明。|2行目の説明。',
               type: WEAPON_TYPE.NORMAL,
               damage: 2,
               speed: 25,
               size: 5,
               color: 0xFFFF00,
               maxAmmo: 30,
               fireRate: SECONDS(0.2),
               reloadTime: SECONDS(1.5)
           }
        ============================================================================ */

        function validateWeaponConfig(categories) {
            const allowedTypes = new Set(Object.values(WEAPON_TYPE));
            const names = new Set();
        
            categories.forEach((category, categoryIndex) => {
                if (!category.name || !Array.isArray(category.weapons)) {
                    console.warn(`[WEAPON CONFIG] カテゴリ ${categoryIndex} の形式が不正です。`);
                    return;
                }
        
                category.weapons.forEach((weapon, weaponIndex) => {
                    const location = `${category.name} > ${weapon.name || `武器${weaponIndex}`}`;
                    if (!weapon.name) console.warn(`[WEAPON CONFIG] ${location}: nameがありません。`);
                    if (names.has(weapon.name)) console.warn(`[WEAPON CONFIG] 武器名「${weapon.name}」が重複しています。`);
                    names.add(weapon.name);
                    if (!allowedTypes.has(weapon.type)) console.warn(`[WEAPON CONFIG] ${location}: type「${weapon.type}」は未対応です。`);
                    if (!(weapon.damage >= 0)) console.warn(`[WEAPON CONFIG] ${location}: damageを0以上にしてください。`);
                    if (!(weapon.maxAmmo >= 1)) console.warn(`[WEAPON CONFIG] ${location}: maxAmmoを1以上にしてください。`);
                    if (!(weapon.reloadTime >= 1)) console.warn(`[WEAPON CONFIG] ${location}: reloadTimeを設定してください。`);
                    if (!(weapon.fireRate >= 1)) console.warn(`[WEAPON CONFIG] ${location}: fireRateを設定してください。`);
                });
            });

        let lockOnEnabled = false;

        function getLockableEnemies() {
            return enemies
                .filter(enemy => enemy.hp > 0)
                .sort((a, b) => {
                    const distanceA = Math.hypot(a.x - player.x, a.y - player.y);
                    const distanceB = Math.hypot(b.x - player.x, b.y - player.y);
                    return distanceA - distanceB;
                });
        }

        function acquireClosestTarget() {
            const candidates = getLockableEnemies();
            lockedTarget = candidates.length > 0 ? candidates[0] : null;
        }

        function cycleLockOnTarget() {
            if (!lockOnEnabled) return;

            const candidates = getLockableEnemies();
            if (candidates.length === 0) {
                lockedTarget = null;
                return;
            }

            const currentIndex = candidates.indexOf(lockedTarget);
            lockedTarget = candidates[(currentIndex + 1 + candidates.length) % candidates.length];
        }

        function updateLockOnTarget() {
            if (!lockOnEnabled) {
                lockedTarget = null;
                return;
            }

            if (!lockedTarget || !enemies.includes(lockedTarget) || lockedTarget.hp <= 0) {
                acquireClosestTarget();
            }
        }

        function getAimPosition() {
            if (lockOnEnabled && lockedTarget) {
                return { x: lockedTarget.x, y: lockedTarget.y };
            }
            return { x: mouse.worldX, y: mouse.worldY };
        }

        // 角度の境界（-180度と180度）をまたいでも、最短方向へ一定速度で旋回する。
        function moveAngleTowards(current, target, maxStep) {
            const difference = Math.atan2(Math.sin(target - current), Math.cos(target - current));
            if (Math.abs(difference) <= maxStep) return target;
            return current + Math.sign(difference) * maxStep;
        }

        function removeMesh(mesh) {
            if (!mesh) return;
            if (mesh.parent) mesh.parent.remove(mesh);
            mesh.traverse((child) => {
                if (child.geometry && !child.geometry.userData?.sharedEffectGeometry) child.geometry.dispose();
                if (child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach((material) => {
                        if (material.map && material.map !== glowTexture) material.map.dispose();
                        if (material.bumpMap && material.bumpMap !== material.map) material.bumpMap.dispose();
                        material.dispose();
                    });
                }
            });
        }

        function createGlowTexture() {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(64, 64, 2, 64, 64, 64);
            grad.addColorStop(0.0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.18, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.48, 'rgba(255,255,255,0.25)');
            grad.addColorStop(1.0, 'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        function createGroundTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const g = c.getContext('2d');
            g.fillStyle = '#111922';
            g.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 12000; i++) {
                const v = 20 + Math.floor(Math.random() * 26);
                g.fillStyle = `rgba(${v}, ${v + 8}, ${v + 14}, ${Math.random() * 0.13})`;
                g.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
            }

            g.strokeStyle = 'rgba(80, 150, 175, 0.14)';
            g.lineWidth = 2;
            for (let p = 0; p <= 512; p += 64) {
                g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 512); g.stroke();
                g.beginPath(); g.moveTo(0, p); g.lineTo(512, p); g.stroke();
            }

            g.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            g.lineWidth = 1;
            for (let p = 0; p <= 512; p += 16) {
                g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 512); g.stroke();
                g.beginPath(); g.moveTo(0, p); g.lineTo(512, p); g.stroke();
            }

            const texture = new THREE.CanvasTexture(c);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(12, 9);
            texture.anisotropy = renderer3D.capabilities.getMaxAnisotropy();
            return texture;
        }

        function removeHazardAt(index) {
            const hazard = hazards[index];
            if (!hazard) return;
            if (hazard.mesh) removeMesh(hazard.mesh);
            if (hazard.warningMesh) removeMesh(hazard.warningMesh);
            hazards.splice(index, 1);
        }

        function trimFireHazards() {
            let activeCount = hazards.filter(h => h.kind === 'fire').length;
            while (activeCount >= MAX_FIRE_HAZARDS) {
                const oldestIndex = hazards.findIndex(h => h.kind === 'fire');
                if (oldestIndex < 0) break;
                removeHazardAt(oldestIndex);
                activeCount--;
            }
        }

        function spawnFirePatch(x, y, radius = 46, damage = 8, duration = 300, elite = false) {
            trimFireHazards();
            const mesh = createFirePatchVisual(radius, elite);
            mesh.position.set(x, 0, y);
            scene3D.add(mesh);
            hazards.push({ kind: 'fire', x, y, radius, damage, life: duration, maxLife: duration, mesh, elite });
        }

        function igniteFireBomb(bomb) {
            const blastRadius = bomb.elite ? 72 : 58;
            createExplosion(bomb.targetX, bomb.targetY, blastRadius, 'grenade');
            damageObstaclesInRadius(bomb.targetX, bomb.targetY, blastRadius, bomb.elite ? 38 : 24);
            const patchCount = bomb.elite ? 5 : 3;
            const lineAngle = bomb.travelAngle + Math.PI * 0.5;
            for (let i = 0; i < patchCount; i++) {
                const centerOffset = i - (patchCount - 1) * 0.5;
                const spread = centerOffset * (bomb.elite ? 43 : 48);
                const randomAngle = lineAngle + (Math.random() - 0.5) * 0.4;
                const px = Math.max(35, Math.min(WORLD_WIDTH - 35, bomb.targetX + Math.cos(randomAngle) * spread + (Math.random() - 0.5) * 20));
                const py = Math.max(35, Math.min(WORLD_HEIGHT - 35, bomb.targetY + Math.sin(randomAngle) * spread + (Math.random() - 0.5) * 20));
                spawnFirePatch(px, py, bomb.elite ? 53 : 45, bomb.elite ? 12 : 8, bomb.elite ? 360 : 300, bomb.elite);
            }
        }

        function launchIncendiaryBomb(enemy) {
            if (hazards.filter(h => h.kind === 'fireBomb').length >= MAX_FIRE_BOMBS) return false;
            const moveX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
            const moveY = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
            const leadDistance = enemy.elite ? 155 : 115;
            const targetX = Math.max(45, Math.min(WORLD_WIDTH - 45, player.x + moveX * leadDistance + (Math.random() - 0.5) * 105));
            const targetY = Math.max(45, Math.min(WORLD_HEIGHT - 45, player.y + moveY * leadDistance + (Math.random() - 0.5) * 105));
            const travelFrames = enemy.elite ? 42 : 52;
            const radius = enemy.elite ? 67 : 56;
            const mesh = createFireBombVisual(enemy.elite);
            mesh.position.set(enemy.x, enemy.size * 1.8, enemy.y);
            scene3D.add(mesh);
            const warningMesh = createFireWarningVisual(targetX, targetY, radius, enemy.elite);
            scene3D.add(warningMesh);
            hazards.push({
                kind: 'fireBomb', startX: enemy.x, startY: enemy.y,
                targetX, targetY, timer: travelFrames, maxTimer: travelFrames,
                travelAngle: Math.atan2(targetY - enemy.y, targetX - enemy.x),
                mesh, warningMesh, elite: enemy.elite
            });
            return true;
        }

        function updateEnemyHazards() {
            if (fireDamageCooldown > 0) fireDamageCooldown--;
            playerInFire = false;

            for (let i = hazards.length - 1; i >= 0; i--) {
                const hazard = hazards[i];
                if (hazard.kind === 'fireBomb') {
                    hazard.timer--;
                    const t = 1 - Math.max(0, hazard.timer) / hazard.maxTimer;
                    const smoothT = t * t * (3 - 2 * t);
                    const x = hazard.startX + (hazard.targetX - hazard.startX) * smoothT;
                    const z = hazard.startY + (hazard.targetY - hazard.startY) * smoothT;
                    const height = 20 + Math.sin(Math.PI * t) * (hazard.elite ? 160 : 125);
                    if (hazard.mesh) {
                        hazard.mesh.position.set(x, height, z);
                        hazard.mesh.rotation.x += 0.13;
                        hazard.mesh.rotation.y += 0.17;
                    }
                    if (hazard.warningMesh) {
                        const pulse = 0.92 + Math.sin(frameCount * 0.34) * 0.08;
                        hazard.warningMesh.scale.set(pulse, pulse, pulse);
                        hazard.warningMesh.rotation.y += 0.025;
                        if (hazard.warningMesh.userData.ring) hazard.warningMesh.userData.ring.material.opacity = 0.28 + t * 0.52;
                    }
                    if (hazard.timer <= 0) {
                        if (hazard.mesh) removeMesh(hazard.mesh);
                        if (hazard.warningMesh) removeMesh(hazard.warningMesh);
                        hazards.splice(i, 1);
                        igniteFireBomb(hazard);
                    }
                    continue;
                }

                if (hazard.kind === 'fire') {
                    hazard.life--;
                    const lifeRatio = Math.max(0, hazard.life / hazard.maxLife);
                    if (hazard.mesh) {
                        hazard.mesh.rotation.y += 0.004;
                        const ground = hazard.mesh.userData.ground;
                        const rim = hazard.mesh.userData.rim;
                        if (ground?.material) ground.material.opacity = 0.08 + lifeRatio * 0.18;
                        if (rim?.material) rim.material.opacity = (0.18 + Math.abs(Math.sin(frameCount * 0.13 + i)) * 0.28) * Math.min(1, lifeRatio * 4);
                        const flames = hazard.mesh.userData.flames || [];
                        flames.forEach((flame, flameIndex) => {
                            const flicker = 0.72 + Math.sin(frameCount * 0.22 + flame.userData.phase + flameIndex) * 0.24;
                            const fade = Math.min(1, hazard.life / 45);
                            const size = flame.userData.baseScale * flicker;
                            flame.scale.set(size, size * (1.12 + flicker * 0.12), 1);
                            flame.position.y = 10 + flicker * 12;
                            flame.material.opacity = (0.34 + flicker * 0.18) * fade;
                        });
                    }

                    const distance = Math.hypot(player.x - hazard.x, player.y - hazard.y);
                    if (distance < hazard.radius + player.size * 0.45) {
                        playerInFire = true;
                        if (fireDamageCooldown <= 0) {
                            player.hp -= hazard.damage;
                            fireDamageCooldown = 18;
                            screenShake = Math.max(screenShake, 3.5);
                        }
                    }

                    if (hazard.life <= 0) removeHazardAt(i);
                }
            }
            return playerInFire ? 0.58 : 1;
        }

        const OBSTACLE_TYPE = Object.freeze({
            BUILDING: 'building',
            TOWER: 'tower',
            FUEL_TANK: 'fuel_tank',
            ANTENNA: 'antenna',
            BUNKER: 'bunker',
            WAREHOUSE: 'warehouse',
            BARRIER: 'barrier'
        });

        const OBSTACLE_HP_SCALE = {
            building: 1.0,
            tower: 1.7,
            fuel_tank: 0.55,
            antenna: 0.45,
            bunker: 2.4,
            warehouse: 1.35,
            barrier: 0.35
        };

        function calcObstacleHp(type, width, depth, height) {
            const base = (width * depth) / 70 + height * 0.55;
            return Math.max(18, Math.round(base * (OBSTACLE_HP_SCALE[type] || 1)));
        }

        function createBuildingModel(width, depth, height, wallColor = null) {
            const group = new THREE.Group();
            const hueShift = Math.random();
            const bodyColor = wallColor ?? (hueShift > 0.5 ? 0x1a2e3d : 0x202a35);
            const wallMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.58, roughness: 0.52 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x0b1118, metalness: 0.76, roughness: 0.3 });
            const lightMat = new THREE.MeshStandardMaterial({ color: 0x2bd9ff, emissive: 0x087a9b, emissiveIntensity: 1.3, metalness: 0.25, roughness: 0.2 });

            const main = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            main.position.y = height / 2;
            main.userData.isMainBody = true;
            group.add(main);

            const roof = new THREE.Mesh(new THREE.BoxGeometry(width * 0.92, 8, depth * 0.92), roofMat);
            roof.position.y = height + 4;
            group.add(roof);

            const unit = new THREE.Mesh(new THREE.BoxGeometry(width * 0.35, 14, depth * 0.28), roofMat);
            unit.position.set(width * 0.18, height + 11, -depth * 0.15);
            group.add(unit);

            const stripCount = Math.max(2, Math.floor(width / 45));
            for (let i = 0; i < stripCount; i++) {
                const strip = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 2), lightMat);
                strip.position.set(-width * 0.36 + (i / Math.max(1, stripCount - 1)) * width * 0.72, Math.min(height * 0.65, 45), depth / 2 + 1.2);
                group.add(strip);
            }
            return enableShadows(group);
        }

        function createObstacleModel(type, width, depth, height) {
            const group = new THREE.Group();
            group.userData.obstacleType = type;

            switch (type) {
                case OBSTACLE_TYPE.TOWER: {
                    const coreW = Math.max(28, width * 0.34);
                    const coreD = Math.max(28, depth * 0.34);
                    const towerH = height * 1.75;
                    const wallMat = new THREE.MeshStandardMaterial({ color: 0x243848, metalness: 0.72, roughness: 0.38 });
                    const accentMat = new THREE.MeshStandardMaterial({ color: 0xff6a2a, emissive: 0x8a2200, emissiveIntensity: 1.4, metalness: 0.2, roughness: 0.25 });
                    const core = new THREE.Mesh(new THREE.BoxGeometry(coreW, towerH, coreD), wallMat);
                    core.position.y = towerH / 2;
                    core.userData.isMainBody = true;
                    group.add(core);
                    for (let i = 1; i <= 4; i++) {
                        const ring = new THREE.Mesh(new THREE.BoxGeometry(coreW + 10, 6, coreD + 10), wallMat);
                        ring.position.y = towerH * (i / 5);
                        group.add(ring);
                    }
                    const beacon = new THREE.Mesh(new THREE.SphereGeometry(5, 10, 8), accentMat);
                    beacon.position.y = towerH + 12;
                    group.add(beacon);
                    const mast = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 18, 8), wallMat);
                    mast.position.y = towerH + 22;
                    group.add(mast);
                    break;
                }
                case OBSTACLE_TYPE.FUEL_TANK: {
                    const tankMat = new THREE.MeshStandardMaterial({ color: 0x6a7078, metalness: 0.82, roughness: 0.28 });
                    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xff4422, emissive: 0x661100, emissiveIntensity: 0.6, metalness: 0.35, roughness: 0.4 });
                    const tankR = Math.min(width, depth) * 0.42;
                    const tank = new THREE.Mesh(new THREE.CylinderGeometry(tankR, tankR, height * 0.85, 18), tankMat);
                    tank.position.y = height * 0.42;
                    tank.userData.isMainBody = true;
                    group.add(tank);
                    for (let i = 0; i < 3; i++) {
                        const stripe = new THREE.Mesh(new THREE.TorusGeometry(tankR + 1.5, 2.2, 6, 24), stripeMat);
                        stripe.rotation.x = Math.PI / 2;
                        stripe.position.y = height * (0.22 + i * 0.22);
                        group.add(stripe);
                    }
                    const base = new THREE.Mesh(new THREE.BoxGeometry(width * 0.95, 10, depth * 0.95), tankMat);
                    base.position.y = 5;
                    group.add(base);
                    break;
                }
                case OBSTACLE_TYPE.ANTENNA: {
                    const poleMat = new THREE.MeshStandardMaterial({ color: 0x8898a8, metalness: 0.85, roughness: 0.22 });
                    const dishMat = new THREE.MeshStandardMaterial({ color: 0xd8ecff, emissive: 0x1a5570, emissiveIntensity: 0.8, metalness: 0.55, roughness: 0.18 });
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(4, 7, height * 1.6, 8), poleMat);
                    pole.position.y = height * 0.8;
                    pole.userData.isMainBody = true;
                    group.add(pole);
                    const dish = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(width, depth) * 0.35, Math.min(width, depth) * 0.22, 4, 16), dishMat);
                    dish.rotation.x = Math.PI / 2;
                    dish.position.set(0, height * 1.35, Math.min(width, depth) * 0.18);
                    group.add(dish);
                    const brace = new THREE.Mesh(new THREE.BoxGeometry(4, height * 0.55, 4), poleMat);
                    brace.position.set(Math.min(width, depth) * 0.12, height * 0.55, 0);
                    brace.rotation.z = 0.35;
                    group.add(brace);
                    break;
                }
                case OBSTACLE_TYPE.BUNKER: {
                    const bunkerH = height * 0.55;
                    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a3238, metalness: 0.65, roughness: 0.62 });
                    const slitMat = new THREE.MeshStandardMaterial({ color: 0x111820, metalness: 0.4, roughness: 0.8 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(width, bunkerH, depth), wallMat);
                    body.position.y = bunkerH / 2;
                    body.userData.isMainBody = true;
                    group.add(body);
                    const cap = new THREE.Mesh(new THREE.BoxGeometry(width * 0.88, 12, depth * 0.88), wallMat);
                    cap.position.y = bunkerH + 6;
                    group.add(cap);
                    for (let i = -1; i <= 1; i++) {
                        const slit = new THREE.Mesh(new THREE.BoxGeometry(width * 0.12, 6, 8), slitMat);
                        slit.position.set(i * width * 0.22, bunkerH * 0.55, depth / 2 + 1);
                        group.add(slit);
                    }
                    break;
                }
                case OBSTACLE_TYPE.WAREHOUSE: {
                    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f2830, metalness: 0.48, roughness: 0.58 });
                    const doorMat = new THREE.MeshStandardMaterial({ color: 0xffc44a, emissive: 0x664400, emissiveIntensity: 0.7, metalness: 0.2, roughness: 0.35 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(width, height * 0.72, depth), wallMat);
                    body.position.y = height * 0.36;
                    body.userData.isMainBody = true;
                    group.add(body);
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(width * 1.02, 6, depth * 1.02), wallMat);
                    roof.position.y = height * 0.72 + 3;
                    group.add(roof);
                    const door = new THREE.Mesh(new THREE.BoxGeometry(width * 0.28, height * 0.42, 4), doorMat);
                    door.position.set(0, height * 0.22, depth / 2 + 2);
                    group.add(door);
                    for (let i = 0; i < 3; i++) {
                        const vent = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 18), wallMat);
                        vent.position.set(-width * 0.28 + i * width * 0.28, height * 0.72 + 8, 0);
                        group.add(vent);
                    }
                    break;
                }
                case OBSTACLE_TYPE.BARRIER: {
                    const sandMat = new THREE.MeshStandardMaterial({ color: 0x6a5a42, metalness: 0.15, roughness: 0.92 });
                    const bagMat = new THREE.MeshStandardMaterial({ color: 0x8a7458, metalness: 0.08, roughness: 0.95 });
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height * 0.55, depth), sandMat);
                    wall.position.y = height * 0.28;
                    wall.userData.isMainBody = true;
                    group.add(wall);
                    for (let i = 0; i < 4; i++) {
                        const bag = new THREE.Mesh(new THREE.BoxGeometry(width * 0.22, height * 0.18, depth * 0.8), bagMat);
                        bag.position.set(-width * 0.28 + i * width * 0.18, height * 0.58, 0);
                        group.add(bag);
                    }
                    break;
                }
                default:
                    return createBuildingModel(width, depth, height);
            }
            return enableShadows(group);
        }

        function addStageDecoration(mesh) {
            scene3D.add(mesh);
            stageDecorations.push(mesh);
        }

        function canPlaceObstacle(x, y, w, h, playerX, playerY, minDist = 320) {
            const cx = x + w * 0.5;
            const cy = y + h * 0.5;
            if (Math.hypot(cx - playerX, cy - playerY) < minDist) return false;
            for (const o of obstacles) {
                if (x < o.x + o.w + 40 && x + w + 40 > o.x && y < o.y + o.h + 40 && y + h + 40 > o.y) return false;
            }
            return true;
        }

        function spawnObstacle(type, x, y, w, h, height, playerX, playerY, hpOverride = null) {
            if (!canPlaceObstacle(x, y, w, h, playerX, playerY)) return false;
            const hp = hpOverride ?? calcObstacleHp(type, w, h, height);
            const obs = {
                type,
                x, y, w, h,
                height,
                hp,
                maxHp: hp,
                hitFlash: 0,
                mesh: null
            };
            obs.mesh = createObstacleModel(type, w, h, height);
            obs.mesh.position.set(x + w / 2, 0, y + h / 2);
            scene3D.add(obs.mesh);
            obstacles.push(obs);
            return true;
        }

        function addRoadMarkings() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a2834, metalness: 0.12, roughness: 0.92 });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.35, depthWrite: false });
            const padMat = new THREE.MeshBasicMaterial({ color: 0x2bd9ff, transparent: true, opacity: 0.28, depthWrite: false });

            const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_WIDTH, 140), roadMat);
            hRoad.rotation.x = -Math.PI / 2;
            hRoad.position.set(WORLD_WIDTH / 2, 0.15, WORLD_HEIGHT / 2);
            addStageDecoration(hRoad);

            const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(140, WORLD_HEIGHT), roadMat);
            vRoad.rotation.x = -Math.PI / 2;
            vRoad.position.set(WORLD_WIDTH / 2, 0.15, WORLD_HEIGHT / 2);
            addStageDecoration(vRoad);

            for (let i = -8; i <= 8; i++) {
                if (i === 0) continue;
                const dashH = new THREE.Mesh(new THREE.PlaneGeometry(42, 6), lineMat);
                dashH.rotation.x = -Math.PI / 2;
                dashH.position.set(WORLD_WIDTH / 2 + i * 110, 0.25, WORLD_HEIGHT / 2);
                addStageDecoration(dashH);
                const dashV = new THREE.Mesh(new THREE.PlaneGeometry(6, 42), lineMat);
                dashV.rotation.x = -Math.PI / 2;
                dashV.position.set(WORLD_WIDTH / 2, 0.25, WORLD_HEIGHT / 2 + i * 110);
                addStageDecoration(dashV);
            }

            const pad = new THREE.Mesh(new THREE.RingGeometry(70, 95, 32), padMat);
            pad.rotation.x = -Math.PI / 2;
            pad.position.set(WORLD_WIDTH / 2, 0.3, WORLD_HEIGHT / 2);
            addStageDecoration(pad);

            const padInner = new THREE.Mesh(new THREE.RingGeometry(18, 24, 24), padMat);
            padInner.rotation.x = -Math.PI / 2;
            padInner.position.set(WORLD_WIDTH / 2, 0.32, WORLD_HEIGHT / 2);
            addStageDecoration(padInner);

            const corners = [
                [WORLD_WIDTH * 0.18, WORLD_HEIGHT * 0.18],
                [WORLD_WIDTH * 0.82, WORLD_HEIGHT * 0.18],
                [WORLD_WIDTH * 0.18, WORLD_HEIGHT * 0.82],
                [WORLD_WIDTH * 0.82, WORLD_HEIGHT * 0.82]
            ];
            corners.forEach(([cx, cy]) => {
                const zone = new THREE.Mesh(new THREE.RingGeometry(55, 68, 24), new THREE.MeshBasicMaterial({ color: 0xff5533, transparent: true, opacity: 0.18, depthWrite: false }));
                zone.rotation.x = -Math.PI / 2;
                zone.position.set(cx, 0.28, cy);
                addStageDecoration(zone);
            });
        }

        function generateStageMap(playerX, playerY) {
            obstacles = [];
            stageDecorations.forEach(removeMesh);
            stageDecorations = [];
            addRoadMarkings();

            const landmarks = [
                { type: OBSTACLE_TYPE.TOWER, x: WORLD_WIDTH * 0.12, y: WORLD_HEIGHT * 0.10, w: 70, h: 70, height: 160 },
                { type: OBSTACLE_TYPE.TOWER, x: WORLD_WIDTH * 0.84, y: WORLD_HEIGHT * 0.12, w: 65, h: 65, height: 145 },
                { type: OBSTACLE_TYPE.ANTENNA, x: WORLD_WIDTH * 0.78, y: WORLD_HEIGHT * 0.78, w: 55, h: 55, height: 130 },
                { type: OBSTACLE_TYPE.BUNKER, x: WORLD_WIDTH * 0.08, y: WORLD_HEIGHT * 0.72, w: 220, h: 180, height: 90 },
                { type: OBSTACLE_TYPE.WAREHOUSE, x: WORLD_WIDTH * 0.68, y: WORLD_HEIGHT * 0.38, w: 280, h: 120, height: 85 },
                { type: OBSTACLE_TYPE.WAREHOUSE, x: WORLD_WIDTH * 0.14, y: WORLD_HEIGHT * 0.40, w: 260, h: 110, height: 80 },
                { type: OBSTACLE_TYPE.FUEL_TANK, x: WORLD_WIDTH * 0.20, y: WORLD_HEIGHT * 0.16, w: 90, h: 90, height: 75 },
                { type: OBSTACLE_TYPE.FUEL_TANK, x: WORLD_WIDTH * 0.26, y: WORLD_HEIGHT * 0.20, w: 85, h: 85, height: 72 },
                { type: OBSTACLE_TYPE.FUEL_TANK, x: WORLD_WIDTH * 0.23, y: WORLD_HEIGHT * 0.24, w: 80, h: 80, height: 70 }
            ];
            landmarks.forEach(lm => spawnObstacle(lm.type, lm.x, lm.y, lm.w, lm.h, lm.height, playerX, playerY));

            const barrierSites = [
                [WORLD_WIDTH * 0.42, WORLD_HEIGHT * 0.30],
                [WORLD_WIDTH * 0.58, WORLD_HEIGHT * 0.68],
                [WORLD_WIDTH * 0.30, WORLD_HEIGHT * 0.58],
                [WORLD_WIDTH * 0.70, WORLD_HEIGHT * 0.42],
                [WORLD_WIDTH * 0.48, WORLD_HEIGHT * 0.18],
                [WORLD_WIDTH * 0.52, WORLD_HEIGHT * 0.82]
            ];
            barrierSites.forEach(([bx, by]) => {
                spawnObstacle(OBSTACLE_TYPE.BARRIER, bx, by, 120, 35, 45, playerX, playerY);
            });

            let placed = 0;
            let attempts = 0;
            while (placed < 32 && attempts < 220) {
                attempts++;
                const ow = Math.random() * 140 + 55;
                const oh = Math.random() * 140 + 55;
                const ox = Math.random() * (WORLD_WIDTH - ow - 120) + 60;
                const oy = Math.random() * (WORLD_HEIGHT - oh - 120) + 60;
                const height = Math.random() * 95 + 55;
                const roll = Math.random();
                const type = roll < 0.62 ? OBSTACLE_TYPE.BUILDING
                    : roll < 0.78 ? OBSTACLE_TYPE.WAREHOUSE
                    : roll < 0.90 ? OBSTACLE_TYPE.BUNKER
                    : OBSTACLE_TYPE.TOWER;
                if (spawnObstacle(type, ox, oy, ow, oh, height, playerX, playerY)) placed++;
            }
        }

        function updateObstacleVisual(obs) {
            if (!obs.mesh) return;
            const ratio = obs.hp / obs.maxHp;
            obs.mesh.traverse(child => {
                if (child.isMesh && child.material && child.userData.isMainBody) {
                    if (!child.userData.baseColor) child.userData.baseColor = child.material.color.getHex();
                    if (obs.hitFlash > 0) {
                        child.material.emissive?.setHex(0xff8844);
                        child.material.emissiveIntensity = 0.85;
                    } else {
                        child.material.emissive?.setHex(0x000000);
                        child.material.emissiveIntensity = 0;
                        const damaged = 1 - ratio;
                        child.material.color.setHex(child.userData.baseColor);
                        if (damaged > 0.2) child.material.color.offsetHSL(0, -0.08, -damaged * 0.1);
                    }
                }
            });
        }

        function destroyObstacle(index) {
            const obs = obstacles[index];
            if (!obs) return;
            const cx = obs.x + obs.w / 2;
            const cy = obs.y + obs.h / 2;
            createImpactEffect(cx, cy, 'explosive', 0x99aabb, 1.15 + obs.w / 180);
            screenShake = Math.max(screenShake, obs.type === OBSTACLE_TYPE.FUEL_TANK ? 6 : 3);
            if (obs.type === OBSTACLE_TYPE.FUEL_TANK) {
                createExplosion(cx, cy, 95, 'standard');
                damageObstaclesInRadius(cx, cy, 95, 55, index);
            }
            removeMesh(obs.mesh);
            obstacles.splice(index, 1);
        }

        function damageObstacle(index, amount, sourceX, sourceY) {
            const obs = obstacles[index];
            if (!obs || obs.hp <= 0) return false;
            obs.hp -= amount;
            obs.hitFlash = 6;
            updateObstacleVisual(obs);
            if (obs.hp <= 0) {
                destroyObstacle(index);
                return true;
            }
            return false;
        }

        function damageObstaclesInRadius(x, y, radius, damage, skipIndex = -1) {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (i === skipIndex) continue;
                const o = obstacles[i];
                const cx = o.x + o.w / 2;
                const cy = o.y + o.h / 2;
                const dist = Math.hypot(cx - x, cy - y);
                if (dist <= radius + Math.max(o.w, o.h) * 0.35) {
                    const falloff = Math.max(0.35, 1 - dist / Math.max(1, radius));
                    damageObstacle(i, damage * falloff, x, y);
                }
            }
        }

        function getWeaponVisualStyle(weapon) {
            const name = weapon.name || '';
            if (name.includes('パルスレーザー')) return 'pulse';
            if (name.includes('レーザー') || name.includes('ビーム')) return 'laser';
            if (name.includes('レール')) return 'rail';
            if (name.includes('イオン')) return 'ion';
            if (name.includes('ノヴァ')) return 'nova';
            if (name.includes('プラズマボム')) return 'plasma-bomb';
            if (name.includes('プラズマ')) return 'plasma';
            if (name.includes('フレシェット')) return 'flechette';
            if (name.includes('トライスラッグ')) return 'slug';
            if (name.includes('グレネード')) return 'grenade';
            if (name.includes('火炎')) return 'flame';
            if (name.includes('アシッド')) return 'acid';
            if (name.includes('冷却')) return 'cryo';
            if (name.includes('ガイスト')) return 'orb';
            if (name.includes('アルテミス')) return 'photon';
            if (weapon.type === 'missile') return 'missile';
            if (weapon.type === 'rocket') return 'rocket';
            if (weapon.bounces) return 'ricochet';
            if (weapon.type === 'sniper') return 'sniper';
            if (weapon.type === 'shotgun') return 'pellet';
            if (weapon.type === 'machinegun') return 'tracer';
            return 'bullet';
        }

        function registerVisualPart(group, object) {
            group.add(object);
            if (!group.userData.fadeParts) group.userData.fadeParts = [];
            group.userData.fadeParts.push(object);
            if (object.material) {
                object.userData.baseOpacity = (typeof object.material.opacity === 'number') ? object.material.opacity : 1;
            }
            return object;
        }

        function setVisualOpacity(group, opacityScale) {
            if (!group || !group.userData || !group.userData.fadeParts) return;
            group.userData.fadeParts.forEach(part => {
                if (part && part.material) {
                    const baseOpacity = part.userData.baseOpacity ?? 1;
                    part.material.opacity = baseOpacity * opacityScale;
                }
            });
        }

        function createBulletVisual(b) {
            const group = new THREE.Group();
            const style = b.visualStyle || 'bullet';
            const addGlow = (color, size, opacity, y = 0, z = 0) => {
                const glow = makeGlowSprite(color, size, opacity);
                glow.position.set(0, y, z);
                registerVisualPart(group, glow);
                return glow;
            };
            const addMesh = (geometry, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                registerVisualPart(group, mesh);
                return mesh;
            };

            switch (style) {
                case 'laser': {
                    addMesh(
                        new THREE.CylinderGeometry(Math.max(0.4, b.size * 0.12), Math.max(0.7, b.size * 0.26), b.size * 12, 10, 1, true),
                        new THREE.MeshBasicMaterial({ color: b.color, transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending, depthWrite: false }),
                        0, 0, -b.size * 4.2, Math.PI / 2
                    );
                    addMesh(
                        new THREE.CylinderGeometry(Math.max(0.15, b.size * 0.05), Math.max(0.18, b.size * 0.08), b.size * 13.5, 6, 1, true),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }),
                        0, 0, -b.size * 4.8, Math.PI / 2
                    );
                    addMesh(
                        new THREE.TorusGeometry(Math.max(1.2, b.size * 0.55), Math.max(0.12, b.size * 0.08), 8, 24),
                        new THREE.MeshBasicMaterial({ color: b.color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }),
                        0, 0, -b.size * 1.2, Math.PI / 2
                    );
                    addGlow(b.color, b.size * 8.0, 0.42, 0, -b.size * 1.2);
                    break;
                }
                case 'pulse': {
                    addMesh(
                        new THREE.SphereGeometry(Math.max(1.2, b.size * 0.44), 10, 8),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
                    );

        function clear3DScene() {
            [enemies, bullets, enemyBullets, items, explosions, particles, obstacles, hazards, boundaryWalls].forEach(arr => {
                arr.forEach(obj => {
                    if (obj.mesh) removeMesh(obj.mesh);
                    if (obj.meshCore) removeMesh(obj.meshCore);
                    if (obj.meshRing) removeMesh(obj.meshRing);
                    if (obj.meshShock) removeMesh(obj.meshShock);
                    if (obj.warningMesh) removeMesh(obj.warningMesh);
                    if (obj.light && obj.light.parent) obj.light.parent.remove(obj.light);
                    if (obj instanceof THREE.Object3D) removeMesh(obj);
                });
            });
            supportStrikes.forEach(strike => {
                if (strike.warning) removeMesh(strike.warning);
                if (strike.beam) removeMesh(strike.beam);
            });
            supportVisuals.forEach(visual => removeMesh(visual.mesh));
            bossAttacks.forEach(attack => {
                if (attack.mesh) removeMesh(attack.mesh);
                if (attack.warningMesh) removeMesh(attack.warningMesh);
                if (attack.projectileMesh) removeMesh(attack.projectileMesh);
                if (attack.targetMesh) removeMesh(attack.targetMesh);
            });
            bossAttacks = [];
            boss = null;
            cancelSupportDesignation();
            supportStrikes = [];
            supportVisuals = [];
            supportTriggerLatched = false;
            hazards = [];
            fireDamageCooldown = 0;
            playerInFire = false;
            if (player.mesh) { removeMesh(player.mesh); player.mesh = null; }
            stageDecorations.forEach(removeMesh);
            stageDecorations = [];
            boundaryWalls = [];
        }

        function resolveCollision(entity, rect) {
            let closestX = Math.max(rect.x, Math.min(entity.x, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(entity.y, rect.y + rect.h));
            let dx = entity.x - closestX;
            let dy = entity.y - closestY;
            let distance = Math.hypot(dx, dy);

            if (distance < entity.size) {
                if (distance === 0) entity.y -= entity.size;
                else {
                    let overlap = entity.size - distance;
                    entity.x += (dx / distance) * overlap;
                    entity.y += (dy / distance) * overlap;
                }
            }
        }

        function getImpactStyleForBullet(b) {
            if (b.type === 'rocket' || b.type === 'missile') return 'explosive';
            if (b.weaponName?.includes('レーザー') || b.weaponName?.includes('ビーム')) return 'laser';
            if (b.weaponName?.includes('プラズマ') || b.weaponName?.includes('ノヴァ')) return 'plasma';
            if (b.weaponName?.includes('アシッド')) return 'acid';
            if (b.weaponName?.includes('冷却')) return 'cryo';
            if (b.weaponName?.includes('火炎')) return 'flame';
            if (b.weaponName?.includes('フレシェット')) return 'flechette';
            if (b.bounces) return 'ricochet';
            if (b.type === 'sniper') return 'sniper';
            return 'bullet';
        }

        function getEffectGeometry(type) {
            if (effectGeometryCache[type]) return effectGeometryCache[type];
            let geometry;
            switch (type) {
                case 'ring': geometry = new THREE.RingGeometry(0.55, 1, 22); break;
                case 'shockRing': geometry = new THREE.RingGeometry(0.72, 1, 36); break;
                case 'sphere': geometry = new THREE.SphereGeometry(1, 12, 8); break;
                case 'core': geometry = new THREE.IcosahedronGeometry(1, 1); break;
                case 'torus': geometry = new THREE.TorusGeometry(1, 0.08, 8, 28); break;
                case 'tetra': geometry = new THREE.TetrahedronGeometry(1, 0); break;
                case 'box': geometry = new THREE.BoxGeometry(1, 1, 1); break;
                default: geometry = new THREE.TetrahedronGeometry(1, 0); break;
            }
            geometry.userData.sharedEffectGeometry = true;
            effectGeometryCache[type] = geometry;
            return geometry;
        }

        function availableEffectParticles(requested) {
            return Math.max(0, Math.min(requested, MAX_EFFECT_PARTICLES - particles.length));
        }

        function countActiveExplosionLights() {
            let count = 0;
            for (const explosion of explosions) if (explosion.light) count++;
            return count;
        }

        function setBeamBetween(mesh, start, end) {
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = Math.max(0.001, direction.length());
            mesh.position.copy(start).add(end).multiplyScalar(0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
            mesh.scale.set(mesh.userData.width || 1, length, mesh.userData.width || 1);
        }

        function createSupportMarker(radius, color, opacity = 0.72) {
            const group = new THREE.Group();
            const matA = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
            const matB = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: opacity * 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
            const outer = new THREE.Mesh(new THREE.TorusGeometry(radius, Math.max(0.7, radius * 0.018), 8, 48), matA);
            outer.rotation.x = Math.PI / 2;
            const inner = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.55, Math.max(0.45, radius * 0.012), 8, 36), matB);
            inner.rotation.x = Math.PI / 2;
            const crossA = new THREE.Mesh(new THREE.BoxGeometry(radius * 1.45, 0.6, 1.2), matB.clone());
            const crossB = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, radius * 1.45), matB.clone());
            group.add(outer, inner, crossA, crossB);
            group.userData.outer = outer;
            group.userData.inner = inner;
            group.userData.baseRadius = radius;
            return group;
        }

        function createSupportDesignationVisual(weapon) {
            const group = new THREE.Group();
            const beam = new THREE.Mesh(
                new THREE.CylinderGeometry(1, 1, 1, 8, 1, true),
                new THREE.MeshBasicMaterial({ color: weapon.color, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            beam.userData.width = 0.7;
            const beamCore = new THREE.Mesh(
                new THREE.CylinderGeometry(1, 1, 1, 6, 1, true),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.82, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            beamCore.userData.width = 0.22;
            const marker = createSupportMarker(Math.max(38, weapon.blastRadius || 60), weapon.color, 0.68);
            group.add(beam, beamCore, marker);
            group.userData.beam = beam;
            group.userData.beamCore = beamCore;
            group.userData.marker = marker;
            scene3D.add(group);
            return group;
        }

        function cancelSupportDesignation() {
            if (supportDesignation?.visual) removeMesh(supportDesignation.visual);
            supportDesignation = null;
        }

        function beginSupportDesignation(weapon, slot, targetX, targetY) {
            cancelSupportDesignation();
            supportDesignation = {
                weapon,
                slot,
                progress: 0,
                targetX,
                targetY,
                visual: createSupportDesignationVisual(weapon)
            };
        }

        function updateSupportDesignationVisual() {
            if (!supportDesignation?.visual || !player.mesh) return;
            const visual = supportDesignation.visual;
            const start = new THREE.Vector3(player.x, 25, player.y);
            const end = new THREE.Vector3(supportDesignation.targetX, 3.5, supportDesignation.targetY);
            setBeamBetween(visual.userData.beam, start, end);
            setBeamBetween(visual.userData.beamCore, start, end);
            const marker = visual.userData.marker;
            marker.position.set(supportDesignation.targetX, 2.2, supportDesignation.targetY);
            const pulse = 1 + Math.sin(frameCount * 0.16) * 0.06;
            marker.scale.set(pulse, pulse, pulse);
            marker.userData.inner.rotation.z -= 0.035;
            marker.userData.outer.rotation.z += 0.018;
            const ratio = Math.min(1, supportDesignation.progress / Math.max(1, supportDesignation.weapon.designationTime));
            visual.userData.beam.material.opacity = 0.35 + ratio * 0.45;
            visual.userData.beamCore.material.opacity = 0.42 + ratio * 0.5;
        }

        function createStrikeWarning(weapon, x, y) {
            const marker = createSupportMarker(Math.max(32, weapon.blastRadius || 60), weapon.color, 0.58);
            marker.position.set(x, 2.4, y);
            scene3D.add(marker);
            return marker;
        }

        function scheduleSupportStrike(weapon, targetX, targetY) {
            const copiedWeapon = { ...weapon, damage: weapon.damage * (player.damageBoostTimer > 0 ? 2 : 1) };
            const aimAngle = Math.atan2(targetY - player.y, targetX - player.x);
            supportStrikes.push({
                weapon: copiedWeapon,
                kind: copiedWeapon.supportKind,
                x: targetX,
                y: targetY,
                timer: copiedWeapon.strikeDelay,
                started: false,
                shotsFired: 0,
                shotTimer: 0,
                activeTimer: copiedWeapon.duration || 0,
                strafeAngle: aimAngle + Math.PI / 2,
                warning: createStrikeWarning(copiedWeapon, targetX, targetY),
                beam: null,
                done: false
            });
        }

        function finishSupportDesignation(wState) {
            if (!supportDesignation) return;
            const { weapon, targetX, targetY } = supportDesignation;
            scheduleSupportStrike(weapon, targetX, targetY);
            cancelSupportDesignation();
            supportTriggerLatched = true;
            wState.ammo--;
            player.fireTimer = weapon.fireRate;
            screenShake = Math.max(screenShake, 2);
            showPickupNotice(`SUPPORT REQUEST // ${weapon.name}`);
            if (wState.ammo <= 0) {
                wState.isReloading = true;
                wState.reloadTimer = weapon.reloadTime;
            }
        }

        function createSkyTrail(x, y, color, width = 2.5, life = 12, diagonal = 0) {
            if (supportVisuals.length >= 64) return;
            const height = 620;
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(1, 1, 1, 8, 1, true),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            const start = new THREE.Vector3(x + diagonal, height, y - diagonal * 0.25);
            const end = new THREE.Vector3(x, 8, y);
            mesh.userData.width = width;
            setBeamBetween(mesh, start, end);
            scene3D.add(mesh);
            supportVisuals.push({ mesh, life, maxLife: life, type: 'trail' });
        }

        function applySupportAreaDamage(x, y, weapon, radiusScale = 1, damageScale = 1, knockbackScale = 1) {
            const radius = Math.max(1, weapon.blastRadius * radiusScale);
            for (const enemy of enemies) {
                const distance = Math.hypot(enemy.x - x, enemy.y - y);
                if (distance > radius) continue;
                const falloff = Math.max(0.4, 1 - distance / radius);
                damageEnemy(enemy, weapon.damage * damageScale * falloff, x, y, {
                    knockback: (weapon.knockback || 4) * knockbackScale,
                    radius,
                    impactStyle: weapon.supportKind === 'orbitalLaser' ? 'laser' : 'explosive',
                    color: weapon.color,
                    intensity: 0.55 + falloff * 0.4,
                    spawnImpact: false,
                    hitMarkerFrames: 4,
                    hitScale: 0.1
                });
            }
            damageObstaclesInRadius(x, y, radius, weapon.damage * damageScale * 1.05);
        }

        function triggerSupportImpact(strike, x, y, options = {}) {
            const weapon = strike.weapon;
            const radiusScale = options.radiusScale || 1;
            const damageScale = options.damageScale || 1;
            const style = options.style || (strike.kind === 'missileRain' ? 'missile' : (strike.kind === 'kinetic' ? 'heavy' : 'standard'));
            createSkyTrail(x, y, weapon.color, options.trailWidth || 2.5, options.trailLife || 12, options.diagonal || 0);
            createExplosion(x, y, weapon.blastRadius * radiusScale, style);
            applySupportAreaDamage(x, y, weapon, radiusScale, damageScale, options.knockbackScale || 1);
        }

        function updateSupportVisuals() {
            for (let i = supportVisuals.length - 1; i >= 0; i--) {
                const visual = supportVisuals[i];
                visual.life--;
                const ratio = Math.max(0, visual.life / Math.max(1, visual.maxLife));
                if (visual.mesh?.material) visual.mesh.material.opacity = ratio * 0.9;
                if (visual.life <= 0) {
                    removeMesh(visual.mesh);
                    supportVisuals.splice(i, 1);
                }
            }
        }

        function updateSupportStrikes() {
            updateSupportVisuals();
            for (let i = supportStrikes.length - 1; i >= 0; i--) {
                const strike = supportStrikes[i];
                const weapon = strike.weapon;
                if (strike.warning) {
                    const pulse = 1 + Math.sin(frameCount * 0.16 + i) * 0.08;
                    strike.warning.scale.set(pulse, pulse, pulse);
                    strike.warning.userData.outer.rotation.z += 0.024;
                    strike.warning.userData.inner.rotation.z -= 0.045;
                    const countdownRatio = Math.max(0, strike.timer / Math.max(1, weapon.strikeDelay));
                    strike.warning.traverse(child => {
                        if (child.material?.transparent) child.material.opacity = 0.32 + (1 - countdownRatio) * 0.55;
                    });
                }

                if (strike.timer > 0) {
                    strike.timer--;
                    continue;
                }

                if (!strike.started) {
                    strike.started = true;
                    strike.shotTimer = 0;
                    if (strike.kind === 'orbitalLaser') {
                        const beam = new THREE.Mesh(
                            new THREE.CylinderGeometry(1, 1, 1, 20, 1, true),
                            new THREE.MeshBasicMaterial({ color: weapon.color, transparent: true, opacity: 0.78, blending: THREE.AdditiveBlending, depthWrite: false })
                        );
                        beam.userData.width = weapon.blastRadius * 0.34;
                        setBeamBetween(beam, new THREE.Vector3(strike.x, 900, strike.y), new THREE.Vector3(strike.x, 3, strike.y));
                        scene3D.add(beam);
                        strike.beam = beam;
                        createExplosion(strike.x, strike.y, weapon.blastRadius * 0.75, 'nova');
                    }
                }

                if (strike.kind === 'artillery' || strike.kind === 'missileRain') {
                    if (strike.shotsFired < weapon.count) {
                        if (strike.shotTimer <= 0) {
                            const angle = Math.random() * Math.PI * 2;
                            const distance = Math.sqrt(Math.random()) * weapon.spread;
                            const ix = Math.max(10, Math.min(WORLD_WIDTH - 10, strike.x + Math.cos(angle) * distance));
                            const iy = Math.max(10, Math.min(WORLD_HEIGHT - 10, strike.y + Math.sin(angle) * distance));
                            triggerSupportImpact(strike, ix, iy, {
                                style: strike.kind === 'missileRain' ? 'supportMissile' : 'supportArtillery',
                                trailWidth: strike.kind === 'missileRain' ? 1.7 : 2.8,
                                diagonal: strike.kind === 'missileRain' ? 110 : 25
                            });
                            strike.shotsFired++;
                            strike.shotTimer = weapon.interval;
                        } else strike.shotTimer--;
                    } else strike.done = true;
                } else if (strike.kind === 'strafe') {
                    if (strike.shotsFired < weapon.count) {
                        if (strike.shotTimer <= 0) {
                            const t = weapon.count <= 1 ? 0.5 : strike.shotsFired / (weapon.count - 1);
                            const along = (t - 0.5) * weapon.lineLength;
                            const jitter = (Math.random() - 0.5) * 120;
                            const ix = strike.x + Math.cos(strike.strafeAngle) * along + Math.cos(strike.strafeAngle + Math.PI / 2) * jitter;
                            const iy = strike.y + Math.sin(strike.strafeAngle) * along + Math.sin(strike.strafeAngle + Math.PI / 2) * jitter;
                            createSkyTrail(ix, iy, weapon.color, 0.8, 6, 170);
                            createImpactEffect(ix, iy, 'bullet', weapon.color, 0.55);
                            applySupportAreaDamage(ix, iy, weapon, 1, 1, 1);
                            strike.shotsFired++;
                            strike.shotTimer = weapon.interval;
                        } else strike.shotTimer--;
                    } else strike.done = true;
                } else if (strike.kind === 'orbitalLaser') {
                    if (strike.activeTimer > 0) {
                        strike.activeTimer--;
                        if (strike.beam?.material) strike.beam.material.opacity = 0.62 + Math.sin(frameCount * 0.35) * 0.18;
                        if (strike.activeTimer % weapon.tickInterval === 0) {
                            applySupportAreaDamage(strike.x, strike.y, weapon, 1, 1, 1);
                            if (strike.activeTimer % (weapon.tickInterval * 3) === 0) createImpactEffect(strike.x, strike.y, 'laser', weapon.color, 0.7);
                        }
                    } else strike.done = true;
                } else if (strike.kind === 'clusterBomb') {
                    if (strike.shotsFired < weapon.count) {
                        if (strike.shotTimer <= 0) {
                            const angle = Math.random() * Math.PI * 2;
                            const distance = Math.sqrt(Math.random()) * weapon.spread;
                            const ix = strike.x + Math.cos(angle) * distance;
                            const iy = strike.y + Math.sin(angle) * distance;
                            triggerSupportImpact(strike, ix, iy, { style: 'supportArtillery', trailWidth: 3.2 });
                            for (let s = 0; s < weapon.subCount; s++) {
                                const subAngle = Math.PI * 2 * s / weapon.subCount + Math.random() * 0.45;
                                const sx = ix + Math.cos(subAngle) * weapon.subRadius * 1.3;
                                const sy = iy + Math.sin(subAngle) * weapon.subRadius * 1.3;
                                createExplosion(sx, sy, weapon.subRadius, 'supportCluster');
                                const subWeapon = { ...weapon, damage: weapon.subDamage, blastRadius: weapon.subRadius, knockback: weapon.knockback * 0.55 };
                                applySupportAreaDamage(sx, sy, subWeapon, 1, 1, 1);
                            }
                            strike.shotsFired++;
                            strike.shotTimer = weapon.interval;
                        } else strike.shotTimer--;
                    } else strike.done = true;
                } else if (strike.kind === 'kinetic') {
                    if (strike.shotsFired === 0) {
                        triggerSupportImpact(strike, strike.x, strike.y, { style: 'supportKinetic', trailWidth: 8, trailLife: 18, damageScale: 1, knockbackScale: 1.2 });
                        strike.shotsFired = 1;
                    } else strike.done = true;
                }

                if (strike.done) {
                    if (strike.warning) removeMesh(strike.warning);
                    if (strike.beam) removeMesh(strike.beam);
                    supportStrikes.splice(i, 1);
                }
            }
        }

        function createImpactEffect(x, y, style = 'bullet', color = 0xffffff, intensity = 1) {
            const palette = {
                bullet: { primary: color, secondary: 0xffffff, count: 6, speed: 8, size: 2.1 },
                sniper: { primary: 0x9fe9ff, secondary: 0xffffff, count: 10, speed: 12, size: 2.6 },
                laser: { primary: color, secondary: 0xffffff, count: 8, speed: 9, size: 2.2 },
                plasma: { primary: color, secondary: 0xbaffff, count: 12, speed: 7, size: 3.0 },
                flame: { primary: 0xff7d2a, secondary: 0xffd270, count: 7, speed: 5, size: 3.2 },
                acid: { primary: 0x54ff60, secondary: 0xd8ff5e, count: 9, speed: 6, size: 3.0 },
                cryo: { primary: 0x7ce8ff, secondary: 0xf2ffff, count: 9, speed: 6, size: 2.8 },
                flechette: { primary: 0xe7fcff, secondary: color, count: 7, speed: 10, size: 1.8 },
                ricochet: { primary: color, secondary: 0xffffff, count: 10, speed: 11, size: 2.3 },
                explosive: { primary: 0xffb04a, secondary: 0xfff0b2, count: 14, speed: 14, size: 3.4 }
            };
            const cfg = palette[style] || palette.bullet;
            if (particles.length >= MAX_EFFECT_PARTICLES) return;
            const ring = new THREE.Mesh(
                getEffectGeometry('ring'),
                new THREE.MeshBasicMaterial({ color: cfg.primary, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(x, 3, y);
            ring.userData.baseScale = 12 * intensity;
            ring.scale.set(4, 4, 4);
            ring.userData.isEffectRing = true;
            ring.userData.life = 10;
            ring.userData.maxLife = 10;
            scene3D.add(ring);
            particles.push({ x, y, vx: 0, vy: 0, size: 1, life: 10, mesh: ring, effectRing: true });

            const shardCount = availableEffectParticles(Math.round(cfg.count * intensity));
            for (let i = 0; i < shardCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (cfg.speed * (0.45 + Math.random() * 0.8)) * intensity;
                const size = cfg.size * (0.7 + Math.random() * 0.8);
                const shard = {
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size,
                    life: 10 + Math.random() * 10,
                    mesh: new THREE.Mesh(
                        getEffectGeometry('tetra'),
                        new THREE.MeshBasicMaterial({ color: Math.random() > 0.35 ? cfg.primary : cfg.secondary, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
                    )
                };
                shard.mesh.scale.set(size, size, size);
                shard.mesh.position.set(x, 10 + Math.random() * 14, y);
                scene3D.add(shard.mesh);
                particles.push(shard);
            }
        }

        function createLingeringField(x, y, radius, color, damage, duration = 180) {
            const ring = new THREE.Mesh(
                getEffectGeometry('shockRing'),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(x, 2.2, y);
            ring.scale.set(radius, radius, radius);
            scene3D.add(ring);
            explosions.push({ x, y, radius, maxRadius: radius, life: duration, maxLife: duration, mesh: null, meshCore: null, meshRing: null, meshShock: ring, light: null, lingering: true, fieldDamage: damage, fieldTick: 0, fieldColor: color });
        }

        function getExplosionProfile(b) {
            const profile = {
                style: b.explosionStyle || (b.type === 'missile' ? 'missile' : 'standard'),
                knockback: b.knockback || Math.max(8, (b.blastRadius || 0) * 0.08),
                clusterCount: b.clusterCount || 0,
                clusterRadius: b.clusterRadius || 45,
                clusterDamage: b.clusterDamage || Math.max(2, b.damage * 0.4),
                lingeringField: !!b.lingeringField,
                fieldRadius: b.fieldRadius || Math.max(40, (b.blastRadius || 80) * 0.42),
                fieldDamage: b.fieldDamage || 1.5,
                fieldDuration: b.fieldDuration || 150
            };
            return profile;
        }

        function applyEnemyKnockback(enemy, sourceX, sourceY, force, radius = 0) {
            if (!enemy) return;
            let dx = enemy.x - sourceX;
            let dy = enemy.y - sourceY;
            let dist = Math.hypot(dx, dy);
            if (dist < 0.001) {
                const angle = Math.random() * Math.PI * 2;
                dx = Math.cos(angle);
                dy = Math.sin(angle);
                dist = 1;
            }
            let strength = force * (enemy.knockbackResistance ?? 1);
            if (radius > 0) strength *= Math.max(0.18, 1 - dist / radius);
            enemy.vx += (dx / dist) * strength;
            enemy.vy += (dy / dist) * strength;
            enemy.hitScale = Math.max(enemy.hitScale || 0, Math.min(0.42, 0.08 + strength * 0.01));
            enemy.hitFlash = Math.max(enemy.hitFlash || 0, 1);
        }

        function damageEnemy(enemy, amount, sourceX, sourceY, options = {}) {
            if (!enemy || enemy.hp <= 0) return false;
            enemy.hp -= amount;
            enemy.hitFlash = Math.max(enemy.hitFlash || 0, options.flash ?? 1);
            enemy.hitScale = Math.max(enemy.hitScale || 0, options.hitScale ?? Math.min(0.34, 0.05 + amount * 0.02));
            if (sourceX !== undefined && sourceY !== undefined && options.knockback) {
                applyEnemyKnockback(enemy, sourceX, sourceY, options.knockback, options.radius || 0);
            }
            if (options.spawnImpact !== false) {
                createImpactEffect(enemy.x, enemy.y, options.impactStyle || 'bullet', options.color || enemy.color, options.intensity || 1);
            }
            hitMarkerTimer = Math.max(hitMarkerTimer, options.hitMarkerFrames || 4);
            return enemy.hp <= 0;
        }

        function detonateProjectile(b) {
            const profile = getExplosionProfile(b);
            createExplosion(b.x, b.y, b.blastRadius, profile.style);
            for (let k = 0; k < enemies.length; k++) {
                const enemy = enemies[k];
                const dist = Math.hypot(enemy.x - b.x, enemy.y - b.y);
                if (dist <= b.blastRadius) {
                    const falloff = Math.max(0.35, 1 - dist / Math.max(1, b.blastRadius));
                    damageEnemy(enemy, b.damage * falloff, b.x, b.y, {
                        knockback: profile.knockback,
                        radius: b.blastRadius,
                        impactStyle: 'explosive',
                        color: b.color,
                        intensity: 0.85 + falloff * 0.8,
                        spawnImpact: dist < b.blastRadius * 0.72,
                        hitMarkerFrames: 5,
                        hitScale: 0.16
                    });
                }
            }
            if (profile.clusterCount > 0) {
                for (let i = 0; i < profile.clusterCount; i++) {
                    const angle = (Math.PI * 2 / profile.clusterCount) * i + Math.random() * 0.45;
                    const dist = profile.clusterRadius * (0.4 + Math.random() * 0.6);
                    const cx = b.x + Math.cos(angle) * dist;
                    const cy = b.y + Math.sin(angle) * dist;
                    createExplosion(cx, cy, profile.clusterRadius, 'cluster');
                    damageObstaclesInRadius(cx, cy, profile.clusterRadius, profile.clusterDamage * 0.85);
                    for (let k = 0; k < enemies.length; k++) {
                        const enemy = enemies[k];
                        if (Math.hypot(enemy.x - cx, enemy.y - cy) <= profile.clusterRadius) {
                            damageEnemy(enemy, profile.clusterDamage, cx, cy, {
                                knockback: profile.knockback * 0.55,
                                radius: profile.clusterRadius,
                                impactStyle: 'explosive',
                                color: b.color,
                                intensity: 0.7,
                                spawnImpact: false,
                                hitMarkerFrames: 4,
                                hitScale: 0.12
                            });
                        }
                    }
                }
            }
            if (profile.lingeringField) {
                createLingeringField(b.x, b.y, profile.fieldRadius, b.color, profile.fieldDamage, profile.fieldDuration);
            }
            damageObstaclesInRadius(b.x, b.y, b.blastRadius, b.damage * 1.15);
        }

        function getPauseButtonRect(index) {
            return index === 0
                ? { x: 280, y: 286, w: 240, h: 54 }
                : { x: 280, y: 356, w: 240, h: 54 };
        }

        function resetHeldInputs() {
            keys.up = keys.down = keys.left = keys.right = keys.reload = keys.enter = false;
            isMouseDown = false;
        }

        function openRanking() {
            rankingReturnScene = currentScene === SCENE.RESULT ? SCENE.RESULT : SCENE.TITLE;
            currentScene = SCENE.RANKING;
            resetHeldInputs();
            isClicked = false;
            ranking.loadRankings();
        }

        function closeRanking() {
            currentScene = rankingReturnScene;
            resetHeldInputs();
            isClicked = false;
        }

        function finishGame(outcome) {
            ranking.finishRun(defeatedCount, outcome);
            currentScene = SCENE.RESULT;
            isPaused = false;
            cancelSupportDesignation();
            resetHeldInputs();
            isClicked = false;
        }

        function returnFromResult() {
            currentScene = SCENE.TITLE;
            resetHeldInputs();
            isClicked = false;
        }

        function setPaused(paused) {
            if (currentScene !== SCENE.PLAY) return;
            isPaused = paused;
            pauseMenuIndex = 0;
            resetHeldInputs();
            if (paused) cancelSupportDesignation();
        }

        function returnToTitleFromPause() {
            setPaused(false);
            clear3DScene();
            enemies = []; bullets = []; enemyBullets = []; items = [];
            explosions = []; particles = []; obstacles = []; hazards = [];
            supportStrikes = []; supportVisuals = [];
            lockedTarget = null;
            lockOnEnabled = false;
            boss = null;
            bossSpawned = false;
            bossDefeated = false;
            bossIntroTimer = 0;
            bossVictoryTimer = 0;
            bossAttackNoticeTimer = 0;
            bossAttackNotice = '';
            clearBossAttacks();
            currentScene = SCENE.TITLE;
            isClicked = false;
            resetHeldInputs();
        }

        function activatePauseMenuItem() {
            if (pauseMenuIndex === 0) setPaused(false);
            else returnToTitleFromPause();
        }

        function handlePauseMouseClick() {
            for (let i = 0; i < 2; i++) {
                const rect = getPauseButtonRect(i);
                if (pointInRect(mouse.x, mouse.y, rect.x, rect.y, rect.w, rect.h)) {
                    pauseMenuIndex = i;
                    activatePauseMenuItem();
                    break;
                }
            }
            isClicked = false;
            isMouseDown = false;
        }

        function getWaveIndexForDefeated(count) {
            let index = 0;
            for (let i = 0; i < WAVE_CONFIGS.length; i++) {
                if (count >= WAVE_CONFIGS[i].start) index = i;
            }
            return index;
        }

        function getCurrentWaveConfig() {
            return WAVE_CONFIGS[Math.max(0, Math.min(WAVE_CONFIGS.length - 1, currentWave - 1))];
        }

        function chooseWeightedEnemy(weights) {
            const roll = Math.random();
            let total = 0;
            for (const [type, weight] of Object.entries(weights)) {
                total += weight;
                if (roll <= total) return type;
            }
            return 'normal';
        }

        function spawnEnemyUnit(type, elite = false) {
            const baseStats = {
                normal:  { speed: 2.0, color: 0xcc2020, size: 18, hp: 1.4, contactDamage: 12 },
                fast:    { speed: 4.2, color: 0x245de8, size: 12, hp: 1.2, contactDamage: 10 },
                shooter: { speed: 1.45, color: 0x8d258f, size: 20, hp: 3.0, contactDamage: 8 },
                charger: { speed: 2.0, color: 0xe56b19, size: 22, hp: 5.5, contactDamage: 38 },
                bomber:  { speed: 2.25, color: 0x4ecf3b, size: 18, hp: 4.0, contactDamage: 16 },
                brute:   { speed: 0.85, color: 0xb67d25, size: 30, hp: 15, contactDamage: 28 },
                incendiary: { speed: 1.25, color: 0xd44719, size: 23, hp: 7.0, contactDamage: 11 }
            };
            const stats = baseStats[type] || baseStats.normal;
            const hpScale = 1 + (currentWave - 1) * 0.24;
            const size = stats.size * (elite ? 1.14 : 1);
            const spawnDist = 520 + Math.random() * 330;
            const spawnAngle = Math.random() * Math.PI * 2;
            const ex = Math.max(size, Math.min(WORLD_WIDTH - size, player.x + Math.cos(spawnAngle) * spawnDist));
            const ey = Math.max(size, Math.min(WORLD_HEIGHT - size, player.y + Math.sin(spawnAngle) * spawnDist));
            const enemy = {
                x: ex, y: ey,
                size,
                speed: stats.speed * (elite ? 1.08 : 1),
                hp: stats.hp * hpScale * (elite ? 2.15 : 1),
                maxHp: stats.hp * hpScale * (elite ? 2.15 : 1),
                type,
                color: elite ? 0xe0a72e : stats.color,
                elite,
                contactDamage: stats.contactDamage * (elite ? 1.35 : 1),
                fireTimer: Math.random() * 60 + 70,
                touchCooldown: 0,
                chargeState: 'approach',
                chargeTimer: 70 + Math.random() * 80,
                dashTimer: 0,
                chargeAngle: 0,
                fuse: -1,
                hazardTimer: 95 + Math.random() * 90,
                strafeDir: Math.random() < 0.5 ? -1 : 1,
                vx: 0, vy: 0,
                hitFlash: 0, hitScale: 0,
                knockbackResistance: type === 'brute' ? 0.34 : (type === 'incendiary' ? 0.72 : (elite ? 0.65 : 1)),
                mesh: null
            };
            enemy.mesh = createEnemyModel(type, size, enemy.color, elite);
            scene3D.add(enemy.mesh);
            enemies.push(enemy);
            return enemy;
        }

        function createBossGroundRing(x, y, innerRadius, outerRadius, color, opacity = 0.5) {
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(innerRadius, outerRadius, 64),
                new THREE.MeshBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide
                })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(x, 2.8, y);
            scene3D.add(ring);
            return ring;
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lengthSq = dx * dx + dy * dy;
            if (lengthSq <= 0.0001) return Math.hypot(px - x1, py - y1);
            const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lengthSq));
            const cx = x1 + dx * t;
            const cy = y1 + dy * t;
            return Math.hypot(px - cx, py - cy);
        }

        function getBossPhase(enemy = boss) {
            if (!enemy || enemy.maxHp <= 0) return 1;
            const ratio = enemy.hp / enemy.maxHp;
