            if (ratio <= 0.33) return 3;
            if (ratio <= 0.66) return 2;
            return 1;
        }

        function setBossAttackNotice(text, frames = 120) {
            bossAttackNotice = text;
            bossAttackNoticeTimer = frames;
        }

        function createBossLaserAttack(enemy) {
            const phase = getBossPhase(enemy);
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            const length = 2600;
            const x1 = enemy.x;
            const y1 = enemy.y;
            const x2 = x1 + Math.cos(angle) * length;
            const y2 = y1 + Math.sin(angle) * length;
            const midX = (x1 + x2) * 0.5;
            const midY = (y1 + y2) * 0.5;
            const width = 58 + phase * 12;

            const group = new THREE.Group();
            group.position.set(midX, 25, midY);
            group.rotation.y = -angle;

            const warning = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshBasicMaterial({ color: 0xff315c, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            warning.scale.set(length, 2.5, 13);
            group.add(warning);

            const outer = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshBasicMaterial({ color: 0xff174f, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            outer.scale.set(length, 34, width * 2.15);
            outer.visible = false;
            group.add(outer);

            const core = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshBasicMaterial({ color: 0xfff4fb, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            core.scale.set(length, 18, width * 0.62);
            core.visible = false;
            group.add(core);

            const muzzle = makeGlowSprite(0xff286c, 260 + phase * 40, 0.8);
            muzzle.position.set(-length * 0.5, 25, 0);
            group.add(muzzle);

            scene3D.add(group);
            bossAttacks.push({
                type: 'laser', enemy, x1, y1, x2, y2, width,
                phase: 'charge', timer: 84 - phase * 6, activeTimer: 66 + phase * 9,
                damageCooldown: 0, mesh: group, warning, outer, core, muzzle
            });

            enemy.attackState = 'laser';
            enemy.attackTimer = 165;
            enemy.facingAngle = angle;
            setBossAttackNotice('EXTREME LASER // 射線から離脱せよ', 165);
        }

        function createBossShockwaves(x, y, phase) {
            const count = 2 + phase;
            for (let i = 0; i < count; i++) {
                const ring = createBossGroundRing(x, y, 0.82, 1.0, i % 2 === 0 ? 0xff456f : 0xffd1e0, 0.75);
                ring.scale.set(4, 4, 4);
                bossAttacks.push({
                    type: 'shockwave', x, y, radius: 4, maxRadius: 430 + phase * 55,
                    speed: 12 + phase * 2.2, delay: i * 17, damage: 34 + phase * 8,
                    hitPlayer: false, mesh: ring
                });
            }
        }

        function startBossSlam(enemy) {
            const phase = getBossPhase(enemy);
            enemy.attackState = 'slamWindup';
            enemy.attackTimer = Math.max(28, 45 - phase * 4);
            enemy.slamTargetX = Math.max(enemy.size, Math.min(WORLD_WIDTH - enemy.size, player.x));
            enemy.slamTargetY = Math.max(enemy.size, Math.min(WORLD_HEIGHT - enemy.size, player.y));
            enemy.slamStartX = enemy.x;
            enemy.slamStartY = enemy.y;
            enemy.slamPhase = phase;
            enemy.slamWarning = createBossGroundRing(enemy.slamTargetX, enemy.slamTargetY, 105, 132, 0xff315f, 0.55);
            setBossAttackNotice('IMPACT SLAM // 着地点から退避せよ', 145);
        }

        function spawnBossMeteor(x, y, phase) {
            x = Math.max(80, Math.min(WORLD_WIDTH - 80, x));
            y = Math.max(80, Math.min(WORLD_HEIGHT - 80, y));
            const radius = 72 + phase * 8;
            const warningMesh = createBossGroundRing(x, y, radius * 0.72, radius, 0xff4b91, 0.52);
            const projectileMesh = new THREE.Group();
            const core = new THREE.Mesh(
                new THREE.IcosahedronGeometry(18 + phase * 2, 1),
                new THREE.MeshBasicMaterial({ color: 0xff4f9d, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            projectileMesh.add(core);
            projectileMesh.add(makeGlowSprite(0xff2779, 145 + phase * 22, 0.65));
            projectileMesh.position.set(x, 390, y);
            scene3D.add(projectileMesh);
            bossAttacks.push({
                type: 'meteor', x, y, radius, timer: 62 - phase * 4, maxTimer: 62 - phase * 4,
                damage: 42 + phase * 9, warningMesh, projectileMesh
            });
        }

        function startBossBarrage(enemy) {
            const phase = getBossPhase(enemy);
            enemy.attackState = 'barrage';
            enemy.attackTimer = 155 + phase * 18;
            enemy.barrageShotsRemaining = 8 + phase * 3;
            enemy.barrageShotTimer = 0;
            enemy.barragePhase = phase;
            setBossAttackNotice('PLASMA RAIN // 複数着弾を確認', enemy.attackTimer);
        }

        function finishBossAttack(enemy, cooldown = 105) {
            enemy.attackState = 'idle';
            enemy.attackTimer = 0;
            enemy.attackCooldown = cooldown;
            enemy.currentAttackName = '';
        }

        function updateBoss(enemy) {
            if (!enemy || enemy.hp <= 0) return;
            const phase = getBossPhase(enemy);
            enemy.phase = phase;

            if (bossIntroTimer > 0) {
                enemy.facingAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.hitScale = Math.max(enemy.hitScale, Math.sin(frameCount * 0.24) * 0.025 + 0.04);
                return;
            }

            const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.facingAngle = angle;

            if (enemy.attackState === 'laser') {
                enemy.attackTimer--;
                if (enemy.attackTimer <= 0) finishBossAttack(enemy, Math.max(78, 125 - phase * 12));
                return;
            }

            if (enemy.attackState === 'slamWindup') {
                enemy.attackTimer--;
                enemy.hitScale = Math.max(enemy.hitScale, 0.06 + Math.abs(Math.sin(frameCount * 0.35)) * 0.08);
                if (enemy.slamWarning) {
                    const pulse = 0.94 + Math.sin(frameCount * 0.3) * 0.08;
                    enemy.slamWarning.scale.set(pulse, pulse, pulse);
                    enemy.slamWarning.material.opacity = 0.38 + Math.abs(Math.sin(frameCount * 0.24)) * 0.38;
                }
                if (enemy.attackTimer <= 0) {
                    enemy.attackState = 'slamAir';
                    enemy.attackTimer = 56;
                    enemy.slamAirDuration = 56;
                }
                return;
            }

            if (enemy.attackState === 'slamAir') {
                const progress = 1 - enemy.attackTimer / enemy.slamAirDuration;
                const eased = progress * progress * (3 - 2 * progress);
                enemy.x = enemy.slamStartX + (enemy.slamTargetX - enemy.slamStartX) * eased;
                enemy.y = enemy.slamStartY + (enemy.slamTargetY - enemy.slamStartY) * eased;
                enemy.jumpHeight = Math.sin(progress * Math.PI) * (260 + phase * 35);
                enemy.attackTimer--;
                if (enemy.attackTimer <= 0) {
                    enemy.x = enemy.slamTargetX;
                    enemy.y = enemy.slamTargetY;
                    enemy.jumpHeight = 0;
                    if (enemy.slamWarning) { removeMesh(enemy.slamWarning); enemy.slamWarning = null; }
                    createExplosion(enemy.x, enemy.y, 175 + phase * 18, 'heavy');
                    damageObstaclesInRadius(enemy.x, enemy.y, 170 + phase * 20, 90);
                    if (Math.hypot(player.x - enemy.x, player.y - enemy.y) <= 165 + phase * 16) {
                        player.hp -= 70 + phase * 12;
                    }
                    createBossShockwaves(enemy.x, enemy.y, phase);
                    screenShake = Math.max(screenShake, 28);
                    enemy.attackState = 'slamRecover';
                    enemy.attackTimer = 40;
                }
                return;
            }

            if (enemy.attackState === 'slamRecover') {
                enemy.attackTimer--;
                if (enemy.attackTimer <= 0) finishBossAttack(enemy, Math.max(72, 112 - phase * 10));
                return;
            }

            if (enemy.attackState === 'barrage') {
                enemy.attackTimer--;
                enemy.barrageShotTimer--;
                if (enemy.barrageShotsRemaining > 0 && enemy.barrageShotTimer <= 0) {
                    const lead = 14 + phase * 5;
                    const targetX = player.x + (keys.right ? lead * 6 : 0) - (keys.left ? lead * 6 : 0) + (Math.random() - 0.5) * (250 + phase * 35);
                    const targetY = player.y + (keys.down ? lead * 6 : 0) - (keys.up ? lead * 6 : 0) + (Math.random() - 0.5) * (250 + phase * 35);
                    spawnBossMeteor(targetX, targetY, phase);
                    enemy.barrageShotsRemaining--;
                    enemy.barrageShotTimer = Math.max(5, 11 - phase * 2);
                }
                const strafeAngle = angle + Math.PI * 0.5;
                enemy.x += Math.cos(strafeAngle) * 0.5 * (enemy.strafeDir || 1);
                enemy.y += Math.sin(strafeAngle) * 0.5 * (enemy.strafeDir || 1);
                if (enemy.attackTimer <= 0) finishBossAttack(enemy, Math.max(76, 118 - phase * 10));
                return;
            }

            // 通常時はプレイヤーの周囲をゆっくり旋回し、一定間隔で攻撃を切り替える。
            const preferredDistance = 430 - phase * 25;
            if (distToPlayer > preferredDistance + 80) {
                enemy.x += Math.cos(angle) * enemy.speed;
                enemy.y += Math.sin(angle) * enemy.speed;
            } else if (distToPlayer < preferredDistance - 100) {
                enemy.x -= Math.cos(angle) * enemy.speed * 0.72;
                enemy.y -= Math.sin(angle) * enemy.speed * 0.72;
            }
            const orbitAngle = angle + (enemy.strafeDir || 1) * Math.PI * 0.5;
            enemy.x += Math.cos(orbitAngle) * enemy.speed * 0.55;
            enemy.y += Math.sin(orbitAngle) * enemy.speed * 0.55;

            enemy.attackCooldown--;
            if (enemy.attackCooldown <= 0) {
                enemy.attackPattern = ((enemy.attackPattern ?? -1) + 1) % 3;
                if (enemy.attackPattern === 0) createBossLaserAttack(enemy);
                else if (enemy.attackPattern === 1) startBossSlam(enemy);
                else startBossBarrage(enemy);
            }
        }

        function updateBossAttacks() {
            for (let i = bossAttacks.length - 1; i >= 0; i--) {
                const attack = bossAttacks[i];

                if (attack.type === 'laser') {
                    if (!attack.enemy || attack.enemy.hp <= 0) {
                        removeMesh(attack.mesh);
                        bossAttacks.splice(i, 1);
                        continue;
                    }
                    attack.timer--;
                    if (attack.phase === 'charge') {
                        const pulse = 0.25 + Math.abs(Math.sin(frameCount * 0.32)) * 0.55;
                        attack.warning.material.opacity = pulse;
                        attack.warning.scale.z = 10 + pulse * 16;
                        attack.muzzle.material.opacity = 0.35 + pulse * 0.55;
                        if (attack.timer <= 0) {
                            attack.phase = 'active';
                            attack.timer = attack.activeTimer;
                            attack.warning.visible = false;
                            attack.outer.visible = true;
                            attack.core.visible = true;
                            screenShake = Math.max(screenShake, 22);
                        }
                    } else {
                        const pulse = 0.82 + Math.sin(frameCount * 0.55) * 0.18;
                        attack.outer.scale.z = attack.width * 2.15 * pulse;
                        attack.core.scale.z = attack.width * 0.62 * (1.08 - pulse * 0.08);
                        attack.outer.material.opacity = 0.46 + Math.abs(Math.sin(frameCount * 0.45)) * 0.22;
                        attack.damageCooldown--;
                        if (attack.damageCooldown <= 0 && pointToSegmentDistance(player.x, player.y, attack.x1, attack.y1, attack.x2, attack.y2) <= attack.width + player.size) {
                            player.hp -= 22 + getBossPhase(attack.enemy) * 5;
                            screenShake = Math.max(screenShake, 12);
                            attack.damageCooldown = 9;
                        }
                        if (attack.timer <= 0) {
                            removeMesh(attack.mesh);
                            bossAttacks.splice(i, 1);
                        }
                    }
                    continue;
                }

                if (attack.type === 'shockwave') {
                    if (attack.delay > 0) {
                        attack.delay--;
                        attack.mesh.visible = false;
                        continue;
                    }
                    attack.mesh.visible = true;
                    attack.radius += attack.speed;
                    const scale = Math.max(1, attack.radius);
                    attack.mesh.scale.set(scale, scale, scale);
                    attack.mesh.material.opacity = Math.max(0, 0.82 * (1 - attack.radius / attack.maxRadius));
                    const dist = Math.hypot(player.x - attack.x, player.y - attack.y);
                    if (!attack.hitPlayer && Math.abs(dist - attack.radius) <= 24 + player.size) {
                        player.hp -= attack.damage;
                        attack.hitPlayer = true;
                        screenShake = Math.max(screenShake, 13);
                    }
                    if (attack.radius >= attack.maxRadius) {
                        removeMesh(attack.mesh);
                        bossAttacks.splice(i, 1);
                    }
                    continue;
                }

                if (attack.type === 'meteor') {
                    attack.timer--;
                    const ratio = Math.max(0, attack.timer / Math.max(1, attack.maxTimer));
                    const pulse = 0.9 + Math.sin(frameCount * 0.3 + i) * 0.08;
                    attack.warningMesh.scale.set(pulse, pulse, pulse);
                    attack.warningMesh.material.opacity = 0.32 + (1 - ratio) * 0.48;
                    attack.projectileMesh.position.y = 32 + ratio * 370;
                    attack.projectileMesh.rotation.y += 0.08;
                    attack.projectileMesh.rotation.x += 0.04;
                    if (attack.timer <= 0) {
                        createExplosion(attack.x, attack.y, attack.radius, 'missile');
                        if (Math.hypot(player.x - attack.x, player.y - attack.y) <= attack.radius + player.size) {
                            player.hp -= attack.damage;
                            screenShake = Math.max(screenShake, 12);
                        }
                        damageObstaclesInRadius(attack.x, attack.y, attack.radius, attack.damage * 0.75);
                        removeMesh(attack.warningMesh);
                        removeMesh(attack.projectileMesh);
                        bossAttacks.splice(i, 1);
                    }
                }
            }
        }

        function clearRegularEnemiesForBoss() {
            enemies.forEach(enemy => {
                if (enemy.mesh) removeMesh(enemy.mesh);
            });
            enemies = [];
            enemyBullets.forEach(bullet => removeMesh(bullet.mesh));
            enemyBullets = [];
            hazards.forEach(hazard => {
                if (hazard.mesh) removeMesh(hazard.mesh);
                if (hazard.warningMesh) removeMesh(hazard.warningMesh);
            });
            hazards = [];
            fireDamageCooldown = 0;
            playerInFire = false;
            lockedTarget = null;
        }

        function spawnBoss() {
            if (bossSpawned || bossDefeated) return;
            bossSpawned = true;
            bossIntroTimer = 180;
            bossAttackNoticeTimer = 0;
            clearRegularEnemiesForBoss();

            const size = 78;
            boss = {
                x: Math.max(size, Math.min(WORLD_WIDTH - size, player.x)),
                y: Math.max(size, Math.min(WORLD_HEIGHT - size, player.y - 480)),
                size,
                speed: 1.22,
                hp: 2200,
                maxHp: 2200,
                type: 'boss',
                isBoss: true,
                name: 'DREADNOUGHT OMEGA',
                color: 0xff2e70,
                elite: true,
                contactDamage: 55,
                touchCooldown: 0,
                vx: 0,
                vy: 0,
                hitFlash: 0,
                hitScale: 0,
                jumpHeight: 0,
                knockbackResistance: 0.035,
                attackState: 'idle',
                attackTimer: 0,
                attackCooldown: 135,
                attackPattern: -1,
                strafeDir: Math.random() < 0.5 ? -1 : 1,
                facingAngle: 0,
                phase: 1,
                mesh: null
            };
            boss.mesh = createBossModel(size);
            boss.mesh.position.set(boss.x, 0, boss.y);
            scene3D.add(boss.mesh);
            enemies.push(boss);

            createExplosion(boss.x, boss.y, 235, 'supportKinetic');
            for (let i = 0; i < 3; i++) {
                const arrivalRing = createBossGroundRing(boss.x, boss.y, 0.82, 1.0, i % 2 === 0 ? 0xff315f : 0xffffff, 0.78);
                arrivalRing.scale.set(4, 4, 4);
                bossAttacks.push({
                    type: 'shockwave', x: boss.x, y: boss.y, radius: 4, maxRadius: 250 + i * 80,
                    speed: 12 + i * 2, delay: i * 10, damage: 0, hitPlayer: true, mesh: arrivalRing
                });
            }
            screenShake = Math.max(screenShake, 30);
            if (lockOnEnabled) acquireClosestTarget();
        }

        function clearBossAttacks() {
            bossAttacks.forEach(attack => {
                if (attack.mesh) removeMesh(attack.mesh);
                if (attack.warningMesh) removeMesh(attack.warningMesh);
                if (attack.projectileMesh) removeMesh(attack.projectileMesh);
                if (attack.targetMesh) removeMesh(attack.targetMesh);
            });
            bossAttacks = [];
        }

        function defeatBoss(enemy, index) {
            if (bossDefeated) return;
            bossDefeated = true;
            bossVictoryTimer = 165;
            setBossAttackNotice('MISSION CLEARED', 165);
            clearBossAttacks();
            if (enemy.slamWarning) removeMesh(enemy.slamWarning);

            for (let i = 0; i < 9; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * enemy.size * 1.8;
                createExplosion(
                    enemy.x + Math.cos(angle) * distance,
                    enemy.y + Math.sin(angle) * distance,
                    95 + Math.random() * 90,
                    i % 3 === 0 ? 'heavy' : 'nova'
                );
            }
            screenShake = Math.max(screenShake, 38);
            removeMesh(enemy.mesh);
            enemies.splice(index, 1);
            lockedTarget = null;
            boss = null;
        }

        function updateWaveProgress() {
            const targetWave = getWaveIndexForDefeated(defeatedCount) + 1;
            if (targetWave !== currentWave) {
                currentWave = targetWave;
                waveNoticeTimer = 180;
                enemySpawnTimer = 35;
                if (currentWave > 1 && enemies.length < getCurrentWaveConfig().maxEnemies) {
                    spawnEnemyUnit('brute', true);
                }
            }
        }

        function spawnEnemyWaveTick() {
            if (bossSpawned || defeatedCount >= BOSS_TRIGGER_KILLS) return;
            updateWaveProgress();
            const config = getCurrentWaveConfig();
            enemySpawnTimer--;
            if (enemySpawnTimer > 0 || enemies.length >= config.maxEnemies) return;
            enemySpawnTimer = config.spawnInterval;
            const availableSlots = config.maxEnemies - enemies.length;
            const count = Math.min(config.spawnCount, availableSlots);
            for (let i = 0; i < count; i++) {
                const type = chooseWeightedEnemy(config.weights);
                const elite = Math.random() < config.eliteChance && type !== 'bomber';
                spawnEnemyUnit(type, elite);
            }
        }

        function init() {
            init3D();

            container.addEventListener('mousedown', (e) => {
                // クリック時にも座標を更新し、武器選択画面で直前のマウス位置を誤使用しないようにする。
                const rect = container.getBoundingClientRect();
                mouse.canvasX = (e.clientX - rect.left) * (SCREEN_WIDTH / rect.width);
                mouse.canvasY = (e.clientY - rect.top) * (SCREEN_HEIGHT / rect.height);
                mouse.x = (mouse.canvasX - UI_OFFSET_X) / UI_SCALE;
                mouse.y = (mouse.canvasY - UI_OFFSET_Y) / UI_SCALE;
                isClicked = true;
                isMouseDown = true;
            });
            container.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mouseup', () => { isMouseDown = false; });

            window.addEventListener('keydown', (e) => {
                if (currentScene === SCENE.RANKING) {
                    e.preventDefault();
                    if (!e.repeat && (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space')) closeRanking();
                    if (!e.repeat && e.code === 'KeyR' && ranking.board.status !== 'loading') ranking.loadRankings();
                    return;
                }
                if (currentScene === SCENE.TITLE || currentScene === SCENE.RESULT) {
                    if (e.code === 'KeyL') {
                        e.preventDefault();
                        if (!e.repeat) openRanking();
                        return;
                    }
                    if (currentScene === SCENE.RESULT && e.code === 'KeyR') {
                        e.preventDefault();
                        if (!e.repeat && ranking.result?.status === 'error') ranking.saveResult();
                        return;
                    }
                }
                if ((e.code === 'Escape' || e.code === 'KeyP') && currentScene === SCENE.PLAY && !e.repeat) {
                    e.preventDefault();
                    setPaused(!isPaused);
                    return;
                }

                if (isPaused && currentScene === SCENE.PLAY) {
                    if (!e.repeat && (e.code === 'KeyW' || e.code === 'ArrowUp')) pauseMenuIndex = (pauseMenuIndex + 1) % 2;
                    if (!e.repeat && (e.code === 'KeyS' || e.code === 'ArrowDown')) pauseMenuIndex = (pauseMenuIndex + 1) % 2;
                    if (!e.repeat && (e.code === 'Enter' || e.code === 'Space')) activatePauseMenuItem();
                    e.preventDefault();
                    return;
                }

                if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
                if (e.code === 'KeyR') keys.reload = true;
                if (e.code === 'Enter' || e.code === 'Space') keys.enter = true;
                
                if (e.code === 'KeyC' && currentScene === SCENE.PLAY && !e.repeat) {
                    // リロード中でも別スロットへ切り替え可能。
                    // リロード処理自体は非アクティブ武器でも継続する。
                    cancelSupportDesignation();
                    supportTriggerLatched = false;
                    player.activeWeaponSlot = (player.activeWeaponSlot + 1) % 2;
                }

                if (e.code === 'KeyX' && currentScene === SCENE.PLAY && !e.repeat) {
                    lockOnEnabled = !lockOnEnabled;
                    if (lockOnEnabled) acquireClosestTarget();
                    else lockedTarget = null;
                }

                if (e.code === 'KeyF' && currentScene === SCENE.PLAY && !e.repeat) {
                    cycleLockOnTarget();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
                if (e.code === 'KeyR') keys.reload = false;
                if (e.code === 'Enter' || e.code === 'Space') keys.enter = false;
            });

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();

                // CSSで縮小表示されていても、1920x1080の内部座標へ正しく変換する。
                mouse.canvasX = (e.clientX - rect.left) * (SCREEN_WIDTH / rect.width);
                mouse.canvasY = (e.clientY - rect.top) * (SCREEN_HEIGHT / rect.height);

                // HUD・照準用の800x600仮想座標。
                mouse.x = (mouse.canvasX - UI_OFFSET_X) / UI_SCALE;
                mouse.y = (mouse.canvasY - UI_OFFSET_Y) / UI_SCALE;

                if (currentScene === SCENE.PLAY) {
                    mouseVec.x = (mouse.canvasX / SCREEN_WIDTH) * 2 - 1;
                    mouseVec.y = -(mouse.canvasY / SCREEN_HEIGHT) * 2 + 1;
                    raycaster.setFromCamera(mouseVec, camera3D);
                    const target = new THREE.Vector3();
                    raycaster.ray.intersectPlane(groundPlane, target);
                    if (target) {
                        mouse.worldX = target.x; 
                        mouse.worldY = target.z; 
                    }
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function update() {
            frameCount++;

            if (isPaused && currentScene === SCENE.PLAY) {
                if (isClicked) handlePauseMouseClick();
                return;
            }

            if (currentScene === SCENE.PLAY) {
                if (waveNoticeTimer > 0) waveNoticeTimer--;
                if (hitMarkerTimer > 0) hitMarkerTimer--;
                if (killMarkerTimer > 0) killMarkerTimer--;
                if (killNoticeTimer > 0) killNoticeTimer--;
                if (killChainTimer > 0) killChainTimer--;
                else killChain = 0;
                if (bossIntroTimer > 0) bossIntroTimer--;
                if (bossAttackNoticeTimer > 0) bossAttackNoticeTimer--;
            }
            if (screenShake > 0) {
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }

            if (currentScene === SCENE.PLAY && hitStopFrames > 0) {
                hitStopFrames--;
                return;
            }

            switch (currentScene) {
                case SCENE.TITLE:
                    if (isClicked && pointInRect(mouse.x, mouse.y, 245, 422, 310, 46)) {
                        openRanking();
                        break;
                    }
                    if (isClicked || keys.enter) {
                        currentScene = SCENE.EQUIP;
                        equipMainIndex = 0;
                        equipMenuState = 1;
                        equipTempCat = equippedWeapons[0].c;
                        equipTempWpn = equippedWeapons[0].w;
                        isClicked = false; keys.enter = false;
                        inputCooldown = 15;
                    }
                    break;

                case SCENE.EQUIP:
                    // マウス操作はキーボードの入力クールダウンに影響されず受け付ける。
                    if (isClicked) {
                        handleEquipMouseClick();
                        isClicked = false;
                    }
                    if (currentScene !== SCENE.EQUIP) break;

                    if (inputCooldown > 0) inputCooldown--;
                    else {
                        if (equipMenuState === 0) {
                            // 従来のキーボード操作も残す: Slot1 → Slot2 → DEPLOY。
                            if (keys.up) { equipMainIndex = (equipMainIndex - 1 + 3) % 3; inputCooldown = 10; }
                            if (keys.down) { equipMainIndex = (equipMainIndex + 1) % 3; inputCooldown = 10; }

                            if (equipMainIndex < 2) {
                                equipTempCat = equippedWeapons[equipMainIndex].c;
                                equipTempWpn = equippedWeapons[equipMainIndex].w;
                            }

                            if (keys.enter) {
                                if (equipMainIndex === 2) {
                                    currentScene = SCENE.STAGE;
                                } else {
                                    equipMenuState = 1;
                                }
                                inputCooldown = 15;
                                keys.enter = false;
                            }
                        } else {
                            // 武器ブラウザ: A/Dでカテゴリ、W/Sで武器、Enterで装備確定。
                            if (keys.left) {
                                equipTempCat = (equipTempCat - 1 + WEAPON_CATEGORIES.length) % WEAPON_CATEGORIES.length;
                                equipTempWpn = 0;
                                inputCooldown = 10;
                            }
                            if (keys.right) {
                                equipTempCat = (equipTempCat + 1) % WEAPON_CATEGORIES.length;
                                equipTempWpn = 0;
                                inputCooldown = 10;
                            }
                            if (keys.up) {
                                const wpns = WEAPON_CATEGORIES[equipTempCat].weapons;
                                equipTempWpn = (equipTempWpn - 1 + wpns.length) % wpns.length;
                                inputCooldown = 10;
                            }
                            if (keys.down) {
                                const wpns = WEAPON_CATEGORIES[equipTempCat].weapons;
                                equipTempWpn = (equipTempWpn + 1) % wpns.length;
                                inputCooldown = 10;
                            }
                            if (keys.enter) {
                                equippedWeapons[equipMainIndex] = { c: equipTempCat, w: equipTempWpn };
                                equipMenuState = 0;
                                inputCooldown = 15;
                                keys.enter = false;
                            }
                        }
                    }
                    break;

                case SCENE.STAGE:
                    if (inputCooldown > 0) inputCooldown--;
                    else if (isClicked || keys.enter) {
                        currentScene = SCENE.PLAY;
                        
                        clear3DScene(); 

                        player.x = WORLD_WIDTH / 2;
                        player.y = WORLD_HEIGHT / 2;
                        player.hp = player.maxHp; 
                        player.activeWeaponSlot = 0;
                        player.fireTimer = 0;
                        player.damageBoostTimer = 0;
                        player.pickupNotice = '';
                        player.pickupNoticeTimer = 0;
                        
                        const w0 = WEAPON_CATEGORIES[equippedWeapons[0].c].weapons[equippedWeapons[0].w];
                        const w1 = WEAPON_CATEGORIES[equippedWeapons[1].c].weapons[equippedWeapons[1].w];
                        ranking.beginRun([w0, w1]);
                        player.weaponsState = [
                            { ammo: w0.maxAmmo, isReloading: false, reloadTimer: 0 },
                            { ammo: w1.maxAmmo, isReloading: false, reloadTimer: 0 }
                        ];

                        enemies = []; bullets = []; enemyBullets = []; items = []; explosions = []; particles = []; obstacles = []; hazards = []; defeatedCount = 0;
                        supportStrikes = []; supportVisuals = []; supportDesignation = null; supportTriggerLatched = false;
                        screenShake = 0;
                        fireDamageCooldown = 0;
                        playerInFire = false;
                        hitStopFrames = 0;
                        hitMarkerTimer = 0;
                        killMarkerTimer = 0;
                        killNoticeTimer = 0;
                        killChain = 0;
                        killChainTimer = 0;
                        isPaused = false;
                        pauseMenuIndex = 0;
                        currentWave = 1;
                        waveNoticeTimer = 150;
                        enemySpawnTimer = 30;
                        lockOnEnabled = false;
                        lockedTarget = null;
                        boss = null;
                        bossSpawned = false;
                        bossDefeated = false;
                        bossIntroTimer = 0;
                        bossVictoryTimer = 0;
                        bossAttackNoticeTimer = 0;
                        bossAttackNotice = '';
                        clearBossAttacks();

                        player.mesh = createPlayerModel();
                        scene3D.add(player.mesh);

                        const wallHeight = 150;
                        const wMat = new THREE.MeshBasicMaterial({ color: 0xff3344, wireframe: true, transparent: true, opacity: 0.22, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
                        const edges = [
                            { x: WORLD_WIDTH/2, z: 0, w: WORLD_WIDTH, d: 0 },
                            { x: WORLD_WIDTH/2, z: WORLD_HEIGHT, w: WORLD_WIDTH, d: 0 },
                            { x: 0, z: WORLD_HEIGHT/2, w: 0, d: WORLD_HEIGHT },
                            { x: WORLD_WIDTH, z: WORLD_HEIGHT/2, w: 0, d: WORLD_HEIGHT },
                        ];
                        edges.forEach(ed => {
                            let geo = ed.w > 0 ? new THREE.PlaneGeometry(ed.w, wallHeight, Math.floor(ed.w/100), 2) : new THREE.PlaneGeometry(ed.d, wallHeight, Math.floor(ed.d/100), 2);
                            const mesh = new THREE.Mesh(geo, wMat.clone());
                            if (ed.d > 0) mesh.rotation.y = Math.PI / 2;
                            mesh.position.set(ed.x, wallHeight/2, ed.z);
                            const glow = makeGlowSprite(0xff2233, 70, 0.12);
                            glow.position.y = wallHeight * 0.45;
                            mesh.add(glow);
                            scene3D.add(mesh);
                            boundaryWalls.push(mesh);
                        });

                        obstacles = [];
                        generateStageMap(player.x, player.y);
                    }
                    break;

                case SCENE.PLAY:
                    const hazardSpeedMultiplier = updateEnemyHazards();
                    const currentMoveSpeed = player.speed * hazardSpeedMultiplier;
                    if (keys.up) player.y -= currentMoveSpeed;
                    if (keys.down) player.y += currentMoveSpeed;
                    if (keys.left) player.x -= currentMoveSpeed;
                    if (keys.right) player.x += currentMoveSpeed;

                    if (player.x < player.size) player.x = player.size;
                    else if (player.x > WORLD_WIDTH - player.size) player.x = WORLD_WIDTH - player.size;
                    if (player.y < player.size) player.y = player.size;
                    else if (player.y > WORLD_HEIGHT - player.size) player.y = WORLD_HEIGHT - player.size;

                    for (let o of obstacles) resolveCollision(player, o);

                    for (let oi = 0; oi < obstacles.length; oi++) {
                        const o = obstacles[oi];
                        if (o.hitFlash > 0) {
                            o.hitFlash--;
                            updateObstacleVisual(o);
                        }
                    }

                    updateLockOnTarget();
                    const aimPosition = getAimPosition();

                    player.mesh.position.set(player.x, 0, player.y);
                    const targetPlayerAngle = Math.atan2(aimPosition.x - player.x, aimPosition.y - player.y);

                    if (lockOnEnabled && lockedTarget) {
                        player.mesh.rotation.y = moveAngleTowards(
                            player.mesh.rotation.y,
                            targetPlayerAngle,
                            LOCK_ON_TURN_SPEED
                        );
                    } else {
                        // 通常照準は従来どおり、マウスへすぐ向ける。
                        player.mesh.rotation.y = targetPlayerAngle;
                    }

                    const aimOffsetX = Math.max(-90, Math.min(90, (aimPosition.x - player.x) * 0.08));
                    const aimOffsetZ = Math.max(-65, Math.min(65, (aimPosition.y - player.y) * 0.06));
                    const targetCam = new THREE.Vector3(player.x + aimOffsetX, 515, player.y + 415 + aimOffsetZ);
                    camera3D.position.lerp(targetCam, 0.13);
                    camera3D.lookAt(player.x + aimOffsetX * 0.35, 3, player.y + aimOffsetZ * 0.35);

                    const eq = equippedWeapons[player.activeWeaponSlot];
                    const weapon = WEAPON_CATEGORIES[eq.c].weapons[eq.w]; 
                    let wState = player.weaponsState[player.activeWeaponSlot];

                    if (player.fireTimer > 0) player.fireTimer--;
                    if (player.damageBoostTimer > 0) player.damageBoostTimer--;
                    if (player.pickupNoticeTimer > 0) player.pickupNoticeTimer--;

                    // 両方の武器のリロードを毎フレーム進める。
                    for (let slot = 0; slot < player.weaponsState.length; slot++) {
                        const slotState = player.weaponsState[slot];
                        if (!slotState.isReloading) continue;
                        const slotEquip = equippedWeapons[slot];
                        const slotWeapon = WEAPON_CATEGORIES[slotEquip.c].weapons[slotEquip.w];
                        slotState.reloadTimer--;
                        if (slotState.reloadTimer <= 0) {
                            slotState.ammo = slotWeapon.maxAmmo;
                            slotState.reloadTimer = 0;
                            slotState.isReloading = false;
                        }
                    }

                    updateSupportStrikes();
                    updateBossAttacks();

                    if (!wState.isReloading && keys.reload && wState.ammo < weapon.maxAmmo) {
                        cancelSupportDesignation();
                        wState.isReloading = true;
                        wState.reloadTimer = weapon.reloadTime;
                    }

                    if (weapon.type === 'support') {
                        if (!isMouseDown) supportTriggerLatched = false;

                        if (supportDesignation && (supportDesignation.slot !== player.activeWeaponSlot || supportDesignation.weapon !== weapon)) {
                            cancelSupportDesignation();
                        }

                        if (!wState.isReloading && isMouseDown && !supportTriggerLatched && player.fireTimer <= 0 && wState.ammo > 0) {
                            const targetX = Math.max(15, Math.min(WORLD_WIDTH - 15, aimPosition.x));
                            const targetY = Math.max(15, Math.min(WORLD_HEIGHT - 15, aimPosition.y));
                            if (!supportDesignation) beginSupportDesignation(weapon, player.activeWeaponSlot, targetX, targetY);
                            supportDesignation.targetX = targetX;
                            supportDesignation.targetY = targetY;
                            supportDesignation.progress++;
                            updateSupportDesignationVisual();
                            if (supportDesignation.progress >= weapon.designationTime) finishSupportDesignation(wState);
                        } else if (supportDesignation && (!isMouseDown || wState.isReloading || wState.ammo <= 0)) {
                            cancelSupportDesignation();
                        }
                    } else {
                        if (supportDesignation) cancelSupportDesignation();
                        if (!isMouseDown) supportTriggerLatched = false;

                        if (!wState.isReloading && isMouseDown && player.fireTimer <= 0 && wState.ammo > 0) {
                            // ロックオン中は、旋回途中の機体正面から発射する。
                            // これによりターゲット変更直後に弾だけが瞬時に曲がる不自然さを防ぐ。
                            const angle = (lockOnEnabled && lockedTarget)
                                ? Math.PI * 0.5 - player.mesh.rotation.y
                                : Math.atan2(aimPosition.y - player.y, aimPosition.x - player.x);
                            
                            let spawnBullets = [];
                            if (weapon.type === 'shotgun') {
                                for (let s = 0; s < weapon.count; s++) {
                                    const spreadAngle = angle + (Math.random() - 0.5) * weapon.spread;
                                    spawnBullets.push({ vx: Math.cos(spreadAngle) * weapon.speed, vy: Math.sin(spreadAngle) * weapon.speed });
                                }
                                screenShake = 3;
                            } else if (weapon.type === 'machinegun' || weapon.type === 'flame') {
                                const spreadAngle = angle + (Math.random() - 0.5) * weapon.spread;
                                spawnBullets.push({ vx: Math.cos(spreadAngle) * weapon.speed, vy: Math.sin(spreadAngle) * weapon.speed });
                            } else {
                                spawnBullets.push({ vx: Math.cos(angle) * weapon.speed, vy: Math.sin(angle) * weapon.speed });
                                if (weapon.type === 'sniper') screenShake = 5;
                                if (weapon.type === 'rocket') screenShake = 2;
                            }

                            spawnBullets.forEach(sb => {
                                let b = {
                                    x: player.x, y: player.y, vx: sb.vx, vy: sb.vy,
                                    size: weapon.size, color: weapon.color,
                                    damage: weapon.damage * (player.damageBoostTimer > 0 ? 2 : 1),
                                    type: weapon.type,
                                    blastRadius: weapon.blastRadius, penetrate: weapon.penetrate, turnSpeed: weapon.turnSpeed,
                                    life: weapon.life || 0, maxLife: weapon.life || 0, hitEnemies: [], mesh: null,
                                    baseSize: weapon.size,
                                    bounces: weapon.bounces || 0, timer: weapon.timer,
                                    visualStyle: getWeaponVisualStyle(weapon), weaponName: weapon.name,
                                    knockback: weapon.knockback, explosionStyle: weapon.explosionStyle,
                                    clusterCount: weapon.clusterCount, clusterRadius: weapon.clusterRadius, clusterDamage: weapon.clusterDamage,
                                    lingeringField: weapon.lingeringField, fieldRadius: weapon.fieldRadius, fieldDamage: weapon.fieldDamage, fieldDuration: weapon.fieldDuration
                                };
                                
                                b.mesh = createBulletVisual(b);
                                b.mesh.position.set(b.x, 15, b.y);
                                scene3D.add(b.mesh);
                                bullets.push(b);
                            });

                            createMuzzleFlash(
                                player.x + Math.cos(angle) * 28,
                                player.y + Math.sin(angle) * 28,
                                weapon.color,
                                angle
                            );
                            wState.ammo--;
                            player.fireTimer = weapon.fireRate;
                            if (wState.ammo <= 0) { wState.isReloading = true; wState.reloadTimer = weapon.reloadTime; }
                        }
                    }

                    for (let i = bullets.length - 1; i >= 0; i--) {
                        let b = bullets[i];
                        
                        if (b.type === 'missile') {
                            let closestDist = Infinity; let target = null;
                            for (let e of enemies) {
                                let d = Math.hypot(e.x - b.x, e.y - b.y);
                                if (d < closestDist) { closestDist = d; target = e; }
                            }
                            if (target) {
                                let targetAngle = Math.atan2(target.y - b.y, target.x - b.x);
                                let currentAngle = Math.atan2(b.vy, b.vx);
                                let diff = targetAngle - currentAngle;
                                while (diff > Math.PI) diff -= Math.PI * 2;
                                while (diff < -Math.PI) diff += Math.PI * 2;
                                let turnAmount = Math.max(-b.turnSpeed, Math.min(b.turnSpeed, diff));
                                let newAngle = currentAngle + turnAmount;
                                let speed = Math.hypot(b.vx, b.vy);
                                b.vx = Math.cos(newAngle) * speed; b.vy = Math.sin(newAngle) * speed;
                            }
                        }

                        if (b.type === 'rocket' || b.type === 'missile') {
                            let p = {
                                x: b.x, y: b.y, vx: (Math.random() - 0.5)*2, vy: (Math.random() - 0.5)*2,
                                size: Math.random() * 4 + 2, life: 15, mesh: null
                            };
                            p.mesh = new THREE.Mesh(
                                new THREE.SphereGeometry(p.size, 6, 5),
                                new THREE.MeshBasicMaterial({
                                    color: b.type === 'missile' ? 0x8090a0 : 0xff8a24,
                                    transparent: true,
                                    opacity: b.type === 'missile' ? 0.34 : 0.62,
                                    blending: b.type === 'missile' ? THREE.NormalBlending : THREE.AdditiveBlending,
                                    depthWrite: false
                                })
                            );
                            p.mesh.position.set(p.x, 15, p.y);
                            scene3D.add(p.mesh);
                            particles.push(p);
                        }

                        if (b.type === 'flame') {
                            b.life--;
                            b.size += 1.0;
                            b.vx *= 0.90;
                            b.vy *= 0.90;

                            if (b.mesh) {
                                const lifeRatio = Math.max(0, b.life / Math.max(1, b.maxLife));
                                const scale = b.size / Math.max(1, b.baseSize);
                                b.mesh.scale.set(scale, scale, scale);

                                // b.meshはTHREE.Groupなので、Group自体にはmaterialが存在しない。
                                // 保持している子パーツのマテリアルを個別にフェードさせる。
                                setVisualOpacity(b.mesh, lifeRatio);
                            }

                            if (b.life <= 0) {
                                removeMesh(b.mesh);
                                bullets.splice(i, 1);
                                continue;
                            }
                        }

                        if (b.timer !== undefined) {
                            b.timer--;
                            b.vx *= 0.95; 
                            b.vy *= 0.95;
                            if (b.timer <= 0) {
                                if (b.type === 'rocket' || b.type === 'missile') {
                                    detonateProjectile(b);
                                }
                                removeMesh(b.mesh); bullets.splice(i, 1); continue;
                            }
                        }

                        b.x += b.vx; b.y += b.vy;
                        if (b.mesh) {
                            b.mesh.position.set(b.x, 15, b.y);
                            b.mesh.rotation.y = Math.atan2(b.vx, b.vy);
                        }
                        
                        if (b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) {
                            if (b.bounces > 0) {
                                b.bounces--;
                                if (b.x < 0 || b.x > WORLD_WIDTH) { b.vx *= -1; b.x += b.vx * 2; }
                                if (b.y < 0 || b.y > WORLD_HEIGHT) { b.vy *= -1; b.y += b.vy * 2; }
                                b.x = Math.max(0, Math.min(WORLD_WIDTH, b.x));
                                b.y = Math.max(0, Math.min(WORLD_HEIGHT, b.y));
                                if (b.mesh) b.mesh.position.set(b.x, 15, b.y);
                                continue;
                            } else {
                                createImpactEffect(b.x, b.y, getImpactStyleForBullet(b), b.color, b.type === 'sniper' ? 1.15 : 0.8);
                                removeMesh(b.mesh); bullets.splice(i, 1); continue;
                            }
                        }

                        let hitWall = false;
                        let hitObs = null;
                        let hitObsIndex = -1;
                        for (let oi = 0; oi < obstacles.length; oi++) {
                            let o = obstacles[oi];
                            if (b.x + b.size > o.x && b.x - b.size < o.x + o.w && b.y + b.size > o.y && b.y - b.size < o.y + o.h) {
                                hitWall = true; hitObs = o; hitObsIndex = oi; break;
                            }
                        }

                        if (hitWall) {
                            if (b.bounces > 0) {
                                b.bounces--;
                                if (hitObsIndex >= 0) damageObstacle(hitObsIndex, b.damage * 0.45, b.x, b.y);
                                let overlapLeft = Math.abs((b.x + b.size) - hitObs.x);
                                let overlapRight = Math.abs(hitObs.x + hitObs.w - (b.x - b.size));
                                let overlapTop = Math.abs((b.y + b.size) - hitObs.y);
                                let overlapBottom = Math.abs(hitObs.y + hitObs.h - (b.y - b.size));

                                let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                                if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                                    b.vx *= -1;
                                    b.x += b.vx * 2; 
                                } else {
                                    b.vy *= -1;
                                    b.y += b.vy * 2;
                                }
                                if (b.mesh) b.mesh.position.set(b.x, 15, b.y);
                                continue;
                            }

                            if (hitObsIndex >= 0) damageObstacle(hitObsIndex, b.damage, b.x, b.y);

                            if (b.type === 'rocket' || b.type === 'missile') {
                                detonateProjectile(b);
                            } else {
                                createImpactEffect(b.x, b.y, getImpactStyleForBullet(b), b.color, b.type === 'sniper' ? 1.05 : 0.78);
                            }
                            removeMesh(b.mesh); bullets.splice(i, 1); continue;
                        }
                    }

                    for (let i = enemyBullets.length - 1; i >= 0; i--) {
                        let eb = enemyBullets[i];
                        eb.x += eb.vx; eb.y += eb.vy;
                        if (eb.mesh) eb.mesh.position.set(eb.x, 15, eb.y);
                        
                        if (eb.x < 0 || eb.x > WORLD_WIDTH || eb.y < 0 || eb.y > WORLD_HEIGHT) {
                            removeMesh(eb.mesh); enemyBullets.splice(i, 1); continue;
                        }
                        let hitWall = false;
                        for (let o of obstacles) {
                            if (eb.x + eb.size > o.x && eb.x - eb.size < o.x + o.w && eb.y + eb.size > o.y && eb.y - eb.size < o.y + o.h) {
                                hitWall = true; break;
                            }
                        }
                        if (hitWall) { removeMesh(eb.mesh); enemyBullets.splice(i, 1); continue; }

                        if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.size + eb.size) {
                            player.hp -= eb.damage || 10; screenShake = 5;
                            removeMesh(eb.mesh); enemyBullets.splice(i, 1);
                        }
                    }

                    for (let i = explosions.length - 1; i >= 0; i--) {
                        let ex = explosions[i];
                        ex.life--; ex.radius += (ex.maxRadius - ex.radius) * (ex.lingering ? 0.03 : 0.15);
                        const lifeRatio = ex.life / ex.maxLife;
                        if (ex.lingering) {
                            if (ex.meshShock) {
                                const pulse = 0.92 + Math.sin(frameCount * 0.18 + i) * 0.08;
                                ex.meshShock.scale.set(ex.radius * pulse, ex.radius * pulse, ex.radius * pulse);
                                ex.meshShock.material.opacity = lifeRatio * 0.34;
                                ex.meshShock.rotation.z += 0.01;
                            }
                            ex.fieldTick = (ex.fieldTick || 0) + 1;
                            if (ex.fieldTick % 12 === 0) {
                                for (let k = 0; k < enemies.length; k++) {
                                    const enemy = enemies[k];
                                    if (Math.hypot(enemy.x - ex.x, enemy.y - ex.y) <= ex.radius) {
                                        damageEnemy(enemy, ex.fieldDamage, ex.x, ex.y, {
                                            knockback: 1.2,
                                            radius: ex.radius,
                                            impactStyle: 'plasma',
                                            color: ex.fieldColor || 0x4befff,
                                            intensity: 0.45,
                                            spawnImpact: false,
                                            hitMarkerFrames: 2,
                                            hitScale: 0.05,
                                            flash: 0.45
                                        });
                                    }
                                }
                            }
                        } else if (ex.mesh) {
                            ex.mesh.scale.set(ex.radius, ex.radius * 0.72, ex.radius);
                            ex.mesh.material.opacity = lifeRatio * 0.54;
                            ex.meshCore.scale.set(ex.radius * 0.52, ex.radius * 0.52, ex.radius * 0.52);
                            ex.meshCore.material.opacity = lifeRatio;

                            if (ex.meshRing) {
                                ex.meshRing.scale.set(ex.radius * 1.18, ex.radius * 1.18, ex.radius * 1.18);
                                ex.meshRing.material.opacity = lifeRatio * 0.9;
                                ex.meshRing.rotation.z += 0.06;
                            }
                            if (ex.meshShock) {
                                ex.meshShock.scale.set(ex.radius * 1.6, ex.radius * 1.6, ex.radius * 1.6);
                                ex.meshShock.material.opacity = lifeRatio * 0.42;
                            }
                            if (ex.light) ex.light.intensity = lifeRatio * 5.5;
                        }
                        if (ex.life <= 0) {
                            removeMesh(ex.mesh); removeMesh(ex.meshCore); removeMesh(ex.meshRing); removeMesh(ex.meshShock);
                            if (ex.light && ex.light.parent) ex.light.parent.remove(ex.light);
                            explosions.splice(i, 1);
                        }
                    }

                    for (let i = particles.length - 1; i >= 0; i--) {
                        let p = particles[i];
                        p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9;
                        p.life--;
                        if (p.mesh) {
                            if (p.effectRing) {
                                p.mesh.position.set(p.x, 2.5, p.y);
                                const opacity = Math.max(0, Math.min(1, p.life / p.mesh.userData.maxLife));
                                const scale = 4 + (1 - opacity) * (p.mesh.userData.baseScale || 12);
                                p.mesh.scale.set(scale, scale, scale);
                                p.mesh.material.opacity = opacity * 0.65;
                            } else {
                                p.mesh.position.set(p.x, 15, p.y);
                                const opacity = Math.max(0, Math.min(1, p.life / 30));
                                if (p.mesh.material) {
                                    p.mesh.material.opacity = opacity;
                                } else {
                                    p.mesh.traverse((child) => {
                                        if (child.material && child.material.transparent) child.material.opacity = opacity;
                                    });
                                }
                            }
                        }
                        if (p.life <= 0) { removeMesh(p.mesh); particles.splice(i, 1); }
                    }

                    spawnEnemyWaveTick();

                    for (let i = enemies.length - 1; i >= 0; i--) {
                        let e = enemies[i];
                        const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        if (e.touchCooldown > 0) e.touchCooldown--;

                        if (e.isBoss) {
                            updateBoss(e);
                        } else if (e.type === 'shooter') {
                            if (distToPlayer > 230) { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed; }
                            e.fireTimer--;
                            if (e.fireTimer <= 0) {
                                const burstCount = currentWave >= 3 ? 2 : 1;
                                for (let shot = 0; shot < burstCount; shot++) {
                                    const shotAngle = angle + (shot - (burstCount - 1) * 0.5) * 0.10;
                                    let eb = { x: e.x, y: e.y, vx: Math.cos(shotAngle) * (4.0 + currentWave * 0.15), vy: Math.sin(shotAngle) * (4.0 + currentWave * 0.15), size: 4, damage: 8 + currentWave * 2, mesh: null };
                                    eb.mesh = createEnemyBulletVisual(0xff32ff);
                                    eb.mesh.position.set(eb.x, 15, eb.y);
                                    scene3D.add(eb.mesh);
                                    enemyBullets.push(eb);
                                }
                                e.fireTimer = Math.max(82, 132 - currentWave * 10);
                            }
                        } else if (e.type === 'charger') {
                            if (e.chargeState === 'windup') {
                                e.chargeTimer--;
                                e.hitScale = Math.max(e.hitScale, 0.08 + Math.sin(frameCount * 0.45) * 0.045);
                                if (e.chargeTimer <= 0) {
                                    e.chargeState = 'dash';
                                    e.dashTimer = 22;
                                    e.chargeAngle = angle;
                                }
                            } else if (e.chargeState === 'dash') {
                                e.x += Math.cos(e.chargeAngle) * e.speed * 5.8;
                                e.y += Math.sin(e.chargeAngle) * e.speed * 5.8;
                                e.dashTimer--;
                                if (e.dashTimer <= 0) {
                                    e.chargeState = 'approach';
                                    e.chargeTimer = 95;
                                }
                            } else {
                                e.x += Math.cos(angle) * e.speed * 0.78;
                                e.y += Math.sin(angle) * e.speed * 0.78;
                                e.chargeTimer--;
                                if (e.chargeTimer <= 0 && distToPlayer > 110 && distToPlayer < 560) {
                                    e.chargeState = 'windup';
                                    e.chargeTimer = 34;
                                }
                            }
                        } else if (e.type === 'bomber') {
                            if (e.fuse >= 0) {
                                e.fuse--;
                                e.hitScale = Math.max(e.hitScale, 0.05 + (45 - e.fuse) / 150);
                                if (e.mesh?.userData.warningRing) {
                                    e.mesh.userData.warningRing.material.opacity = 0.35 + Math.abs(Math.sin(frameCount * 0.45)) * 0.65;
                                }
                                if (e.fuse <= 0) {
                                    createExplosion(e.x, e.y, 145, 'grenade');
                                    if (Math.hypot(player.x - e.x, player.y - e.y) <= 155) {
                                        player.hp -= 135;
                                        screenShake = Math.max(screenShake, 14);
                                    }
                                    e.selfDestruct = true;
                                    e.hp = 0;
                                }
                            } else {
                                e.x += Math.cos(angle) * e.speed;
                                e.y += Math.sin(angle) * e.speed;
                                if (distToPlayer < 115) e.fuse = 45;
                            }
                        } else if (e.type === 'incendiary') {
                            if (distToPlayer > 440) {
                                e.x += Math.cos(angle) * e.speed;
                                e.y += Math.sin(angle) * e.speed;
                            } else if (distToPlayer < 245) {
                                e.x -= Math.cos(angle) * e.speed * 1.05;
                                e.y -= Math.sin(angle) * e.speed * 1.05;
                            } else {
                                const strafeAngle = angle + e.strafeDir * Math.PI * 0.5;
                                e.x += Math.cos(strafeAngle) * e.speed * 0.72;
                                e.y += Math.sin(strafeAngle) * e.speed * 0.72;
                                if (Math.random() < 0.004) e.strafeDir *= -1;
                            }

                            e.hazardTimer--;
                            if (e.hazardTimer <= 0 && distToPlayer < 760) {
                                const launched = launchIncendiaryBomb(e);
                                e.hazardTimer = launched ? (e.elite ? 112 : 165) + Math.random() * 42 : 36;
                                if (e.mesh?.userData.incendiaryNozzle) e.mesh.userData.incendiaryNozzle.scale.set(1.35, 1.35, 1.35);
                            }
                            if (e.mesh?.userData.incendiaryNozzle) {
                                const nozzle = e.mesh.userData.incendiaryNozzle;
                                nozzle.rotation.z += 0.055;
                                nozzle.scale.x += (1 - nozzle.scale.x) * 0.12;
                                nozzle.scale.y += (1 - nozzle.scale.y) * 0.12;
                                nozzle.scale.z += (1 - nozzle.scale.z) * 0.12;
                            }
                        } else if (e.type === 'brute') {
                            if (distToPlayer > 285) { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed; }
                            e.fireTimer--;
                            if (e.fireTimer <= 0) {
                                for (let shot = -1; shot <= 1; shot++) {
                                    const shotAngle = angle + shot * 0.18;
                                    let eb = { x: e.x, y: e.y, vx: Math.cos(shotAngle) * 3.7, vy: Math.sin(shotAngle) * 3.7, size: 6, damage: e.elite ? 22 : 16, mesh: null };
                                    eb.mesh = createEnemyBulletVisual(e.elite ? 0xffe25c : 0xff8a32);
                                    eb.mesh.position.set(eb.x, 18, eb.y);
                                    scene3D.add(eb.mesh);
                                    enemyBullets.push(eb);
                                }
                                e.fireTimer = e.elite ? 105 : 145;
                            }
                        } else {
                            e.x += Math.cos(angle) * e.speed;
                            e.y += Math.sin(angle) * e.speed;
                        }

                        e.x += e.vx; e.y += e.vy;
                        e.vx *= 0.88; e.vy *= 0.88;
                        e.hitFlash *= 0.84;
                        e.hitScale *= 0.78;

                        if (e.x < e.size) e.x = e.size; else if (e.x > WORLD_WIDTH - e.size) e.x = WORLD_WIDTH - e.size;
                        if (e.y < e.size) e.y = e.size; else if (e.y > WORLD_HEIGHT - e.size) e.y = WORLD_HEIGHT - e.size;
                        if (!e.isBoss && e.attackState !== 'slamAir') {
                            for (let o of obstacles) resolveCollision(e, o);
                        }

                        if (e.mesh) {
                            const warningScale = (e.type === 'bomber' && e.fuse >= 0) ? Math.abs(Math.sin(frameCount * 0.35)) * 0.10 : 0;
                            const scale = 1 + e.hitScale + warningScale;
                            const verticalOffset = e.isBoss ? (e.jumpHeight || 0) + e.hitFlash * 5 : e.hitFlash * 6;
                            e.mesh.position.set(e.x, verticalOffset, e.y);
                            e.mesh.scale.set(scale, scale, scale);
                            e.mesh.rotation.y = e.isBoss
                                ? Math.atan2(Math.cos(e.facingAngle || 0), Math.sin(e.facingAngle || 0))
                                : (e.type === 'charger' && e.chargeState === 'dash'
                                    ? Math.atan2(Math.cos(e.chargeAngle), Math.sin(e.chargeAngle))
                                    : Math.atan2(player.x - e.x, player.y - e.y));
                            if (e.mesh.userData.eliteRing) e.mesh.userData.eliteRing.rotation.z += 0.035;
                            if (e.mesh.userData.energyRings) {
                                e.mesh.userData.energyRings[0].rotation.z += 0.018 + e.phase * 0.006;
                                e.mesh.userData.energyRings[1].rotation.z -= 0.026 + e.phase * 0.005;
                            }
                            e.mesh.traverse((child) => {
                                if (child.material && 'emissiveIntensity' in child.material) {
                                    if (child.userData.baseEmissiveIntensity === undefined) child.userData.baseEmissiveIntensity = child.material.emissiveIntensity || 0;
                                    child.material.emissiveIntensity = child.userData.baseEmissiveIntensity + e.hitFlash * 1.7;
                                }
                            });
                        }

                        const contactDist = Math.hypot(player.x - e.x, player.y - e.y);
                        if (!e.selfDestruct && contactDist < player.size + e.size && e.touchCooldown <= 0) {
                            const dashBonus = e.type === 'charger' && e.chargeState === 'dash' ? 1.6 : 1;
                            player.hp -= Math.round(e.contactDamage * dashBonus);
                            screenShake = Math.max(screenShake, e.type === 'brute' ? 9 : 5);
                            e.touchCooldown = 32;
                        }
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        let isHit = false;

                        for (let i = enemies.length - 1; i >= 0; i--) {
                            let e = enemies[i];
                            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + b.size) {
                                if (b.penetrate) {
                                    if (!b.hitEnemies.includes(e)) {
                                        b.hitEnemies.push(e);
                                        damageEnemy(e, b.damage, b.x, b.y, {
                                            knockback: b.type === 'flame' ? 1.6 : (b.type === 'sniper' ? 7 : 3),
                                            impactStyle: getImpactStyleForBullet(b),
                                            color: b.color,
                                            intensity: b.type === 'sniper' ? 1.05 : 0.72,
                                            spawnImpact: true,
                                            hitMarkerFrames: b.type === 'sniper' ? 5 : 4
                                        });
                                        isHit = true;
                                    }
                                } else {
                                    isHit = true;
                                    if (b.type === 'rocket' || b.type === 'missile') {
                                        detonateProjectile(b);
                                    } else {
                                        damageEnemy(e, b.damage, b.x, b.y, {
                                            knockback: b.type === 'sniper' ? 8 : (b.type === 'shotgun' ? 4 : 2.8),
                                            impactStyle: getImpactStyleForBullet(b),
                                            color: b.color,
                                            intensity: b.type === 'sniper' ? 1.18 : 0.8,
                                            spawnImpact: true,
                                            hitMarkerFrames: b.type === 'sniper' ? 6 : 4
                                        });
                                    }
                                }
                                if (!b.penetrate) break; 
                            }
                        }
                        if (isHit && !b.penetrate) { removeMesh(b.mesh); bullets.splice(j, 1); }
                    }

                    for (let i = enemies.length - 1; i >= 0; i--) {
                        let e = enemies[i];
                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                defeatBoss(e, i);
                                continue;
                            }
                            // 弾薬補給はガトリング系の長いリロードを無効化してしまうため削除。
                            // 回復20%、オーバードライブ8%（合計28%）でドロップする。
                            const itemRoll = e.selfDestruct ? 1 : Math.random();
                            let itemType = null;
                            if (itemRoll < 0.20) itemType = 'heal';
                            else if (itemRoll < 0.28) itemType = 'overdrive';

                            if (itemType) {
                                let item = { x: e.x, y: e.y, size: 8, type: itemType, mesh: null };
                                item.mesh = createPickupVisual(itemType);
                                scene3D.add(item.mesh);
                                items.push(item);
                            }

                            // 自爆敵はすでに爆発済みなので、撃破爆発を重複させない。
                            if (!e.selfDestruct) createExplosion(e.x, e.y, Math.max(32, e.size * 3.1), e.elite ? 'heavy' : 'kill');
                            const chunkCount = availableEffectParticles(7);
                            for (let p = 0; p < chunkCount; p++) {
                                const chunkSize = Math.random() * 4 + 1.5;
                                let part = { x: e.x, y: e.y, vx: (Math.random() - 0.5) * 17, vy: (Math.random() - 0.5) * 17, size: chunkSize, life: Math.random() * 15 + 10, mesh: null };
                                part.mesh = new THREE.Mesh(getEffectGeometry('box'), new THREE.MeshBasicMaterial({color: e.color, transparent:true, blending: THREE.AdditiveBlending, depthWrite: false}));
                                part.mesh.scale.set(chunkSize, chunkSize, chunkSize);
                                scene3D.add(part.mesh);
                                particles.push(part);
                            }
                            
                            const wasLockedTarget = lockedTarget === e;
                            screenShake = Math.max(screenShake, 4);
                            // 撃破ごとの強制停止は、連続撃破時に処理落ちのように感じるため廃止。
                            hitStopFrames = 0;
                            if (!e.selfDestruct) {
                                killMarkerTimer = 10;
                                killNoticeTimer = 36;
                                killChain = killChainTimer > 0 ? killChain + 1 : 1;
                                killChainTimer = 90;
                            }
                            removeMesh(e.mesh); enemies.splice(i, 1); defeatedCount++;

                            if (wasLockedTarget) {
                                lockedTarget = null;
                                if (lockOnEnabled) acquireClosestTarget();
                            }
                        }
                    }

                    for (let i = items.length - 1; i >= 0; i--) {
                        let item = items[i];
                        const distToItem = Math.hypot(player.x - item.x, player.y - item.y);
                        if (distToItem < 150) {
                            const angle = Math.atan2(player.y - item.y, player.x - item.x);
                            item.x += Math.cos(angle) * 8; item.y += Math.sin(angle) * 8;
                        }
                        if (item.mesh) {
                            item.mesh.position.set(item.x, 14 + Math.sin(frameCount * 0.08 + i) * 4, item.y);
                            item.mesh.rotation.y += 0.045;
                            const spinParts = item.mesh.userData.spinParts || [];
                            spinParts.forEach((part, index) => {
                                part.rotation.z += index === 0 ? 0.055 : -0.07;
                                part.rotation.y += index === 0 ? 0.018 : 0.045;
                            });
                        }
                        if (Math.hypot(player.x - item.x, player.y - item.y) < player.size + item.size) {
                            if (item.type === 'heal') {
                                player.hp = Math.min(player.maxHp, player.hp + 200);
                                createPickupBurst(item.x, item.y, 0x39f5ff);
                                showPickupNotice('ARMOR RECOVERED +200');
                            } else if (item.type === 'overdrive') {
                                player.damageBoostTimer = 600;
                                createPickupBurst(item.x, item.y, 0xff316c);
                                showPickupNotice('OVERDRIVE // DAMAGE x2');
                            }
                            removeMesh(item.mesh); items.splice(i, 1);
                        }
                    }

                    if (!bossSpawned && defeatedCount >= BOSS_TRIGGER_KILLS) {
                        spawnBoss();
                    }

                    if (bossDefeated) {
                        bossVictoryTimer--;
                        if (bossVictoryTimer <= 0) {
                            finishGame('clear');
                        }
                    } else if (player.hp <= 0) {
                        finishGame('defeat');
                    }
                    break;

                case SCENE.RESULT:
                    if (keys.enter) returnFromResult();
                    else if (isClicked) {
                        if (pointInRect(mouse.x, mouse.y, 65, 470, 210, 48)) openRanking();
                        else if (pointInRect(mouse.x, mouse.y, 295, 470, 210, 48)) returnFromResult();
                        else if (pointInRect(mouse.x, mouse.y, 525, 470, 210, 48) && ranking.result?.status === 'error') ranking.saveResult();
                    }
                    break;
                case SCENE.RANKING:
                    if (isClicked) {
                        if (pointInRect(mouse.x, mouse.y, 140, 510, 240, 44)) closeRanking();
                        else if (pointInRect(mouse.x, mouse.y, 420, 510, 240, 44) && ranking.board.status !== 'loading') ranking.loadRankings();
                    }
                    break;
            }
        }

        function createExplosion(x, y, radius, style = 'standard') {
            const presets = {
                standard: { shell: 0xff3c10, core: 0xffe6a1, ring: 0xffc45c, shock: 0xff7b32, light: 0xff6a22, life: 27, particles: 28, shake: radius > 100 ? 15 : 8 },
                heavy: { shell: 0xff220a, core: 0xfff0c1, ring: 0xff9352, shock: 0xff4d22, light: 0xff5c1c, life: 34, particles: 36, shake: 18 },
                grenade: { shell: 0xff8a34, core: 0xfff7b8, ring: 0xffd26f, shock: 0xffb647, light: 0xffa349, life: 24, particles: 24, shake: 10 },
                missile: { shell: 0xff45a8, core: 0xffd7f8, ring: 0xff9bdc, shock: 0xff4da0, light: 0xff62c8, life: 23, particles: 20, shake: 9 },
                seeker: { shell: 0xff3dbd, core: 0xffd6ff, ring: 0xff7fe6, shock: 0xff66a8, light: 0xff72d0, life: 25, particles: 22, shake: 10 },
                orb: { shell: 0xa65dff, core: 0xf0d2ff, ring: 0xe9beff, shock: 0xc271ff, light: 0xd786ff, life: 26, particles: 24, shake: 10 },
                plasma: { shell: 0x1effc3, core: 0xd4fff4, ring: 0x7efff2, shock: 0x44ffd0, light: 0x5fffe2, life: 28, particles: 30, shake: 14 },
                nova: { shell: 0x49d9ff, core: 0xecfeff, ring: 0xbcefff, shock: 0x6ed1ff, light: 0x75deff, life: 30, particles: 30, shake: 14 },
