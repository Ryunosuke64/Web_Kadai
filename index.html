                shockwave: { shell: 0xf7fbff, core: 0xffffff, ring: 0xbad7ff, shock: 0xeaf3ff, light: 0xf7ffff, life: 24, particles: 18, shake: 11 },
                cluster: { shell: 0xff9f3b, core: 0xfff2c8, ring: 0xffd27e, shock: 0xffc15a, light: 0xffb65f, life: 18, particles: 16, shake: 6 },
                supportArtillery: { shell: 0xff7b22, core: 0xfff1bd, ring: 0xffbd62, shock: 0xff8a38, light: 0xff8a32, life: 20, particles: 9, shake: 8 },
                supportMissile: { shell: 0xff43a3, core: 0xffd8f2, ring: 0xff8fd0, shock: 0xff4f9d, light: 0xff5ab7, life: 18, particles: 7, shake: 6 },
                supportCluster: { shell: 0xff9a44, core: 0xffedba, ring: 0xffc76b, shock: 0xffa14e, light: 0xffa54d, life: 15, particles: 5, shake: 4, useLight: false },
                supportKinetic: { shell: 0xdaf7ff, core: 0xffffff, ring: 0x9eeaff, shock: 0xeafcff, light: 0xbff6ff, life: 28, particles: 14, shake: 18 },
                kill: { shell: 0xffffff, core: 0x9df6ff, ring: 0x62ffd9, shock: 0xffffff, light: 0x7dffde, life: 16, particles: 5, shake: 4, useLight: false }
            };
            const cfg = presets[style] || presets.standard;
            screenShake = Math.max(screenShake, cfg.shake);
            let ex = {
                x, y, radius: 10, maxRadius: radius,
                life: cfg.life, maxLife: cfg.life,
                mesh: null, meshCore: null, meshRing: null, meshShock: null, light: null
            };

            ex.mesh = new THREE.Mesh(
                getEffectGeometry('sphere'),

                getEffectGeometry('core'),
                new THREE.MeshBasicMaterial({ color: cfg.core, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            ex.meshCore.position.set(x, 18, y);

            ex.meshRing = new THREE.Mesh(
                getEffectGeometry('torus'),
                new THREE.MeshBasicMaterial({ color: cfg.ring, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false })
            );

                new THREE.MeshBasicMaterial({ color: cfg.shock, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
            );
            ex.meshShock.rotation.x = -Math.PI / 2;
            ex.meshShock.position.set(x, 2.5, y);

                ex.light = new THREE.PointLight(cfg.light, 4.2, radius * 2.5, 2);

                scene3D.add(ex.light);
            }

            scene3D.add(ex.mesh, ex.meshCore, ex.meshRing, ex.meshShock);
            explosions.push(ex);

                const oldest = explosions.shift();
                removeMesh(oldest.mesh); removeMesh(oldest.meshCore); removeMesh(oldest.meshRing); removeMesh(oldest.meshShock);

                );

                p.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                scene3D.add(p.mesh);
                particles.push(p);
            }

                    const dy = (Math.random() - 0.5) * screenShake;
                    camera3D.position.x += dx; camera3D.position.z += dy;

                    camera3D.position.x -= dx; camera3D.position.z -= dy;

        function getTargetScreenPosition(target) {
            if (!target || !camera3D) return null;

            const projected = new THREE.Vector3(target.x, Math.max(20, target.size * 1.4), target.y);
            projected.project(camera3D);

            if (projected.z < -1 || projected.z > 1) return null;

            const canvasX = (projected.x * 0.5 + 0.5) * SCREEN_WIDTH;
            const canvasY = (-projected.y * 0.5 + 0.5) * SCREEN_HEIGHT;

            return {
                x: (canvasX - UI_OFFSET_X) / UI_SCALE,
                y: (canvasY - UI_OFFSET_Y) / UI_SCALE
            };
        }

        function drawLockOnReticle() {
            if (!lockOnEnabled || !lockedTarget) return;

            const screenPosition = getTargetScreenPosition(lockedTarget);
            if (!screenPosition) return;

            const pulse = 28 + Math.sin(frameCount * 0.16) * 4;
            const cornerLength = 10;

            ctx.save();
            ctx.translate(screenPosition.x, screenPosition.y);
            ctx.rotate(frameCount * 0.008);
            ctx.strokeStyle = '#ff4055';
            ctx.fillStyle = '#ff8090';
            ctx.shadowColor = '#ff1738';
            ctx.shadowBlur = 14;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(-pulse, -pulse + cornerLength); ctx.lineTo(-pulse, -pulse); ctx.lineTo(-pulse + cornerLength, -pulse);
            ctx.moveTo(pulse - cornerLength, -pulse); ctx.lineTo(pulse, -pulse); ctx.lineTo(pulse, -pulse + cornerLength);
            ctx.moveTo(pulse, pulse - cornerLength); ctx.lineTo(pulse, pulse); ctx.lineTo(pulse - cornerLength, pulse);
            ctx.moveTo(-pulse + cornerLength, pulse); ctx.lineTo(-pulse, pulse); ctx.lineTo(-pulse, pulse - cornerLength);
            ctx.stroke();

            ctx.rotate(-frameCount * 0.016);
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillRect(-2, -2, 4, 4);
            ctx.restore();

            const distance = Math.round(Math.hypot(lockedTarget.x - player.x, lockedTarget.y - player.y));
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '12px "Share Tech Mono"';
            ctx.fillStyle = '#ff9aa8';
            ctx.shadowColor = '#ff1738';
            ctx.shadowBlur = 8;
            ctx.fillText(`TARGET // ${distance}m`, screenPosition.x, screenPosition.y + pulse + 21);
            ctx.restore();
        }

        function colorNumberToCss(color) {
            return `#${Number(color).toString(16).padStart(6, '0')}`;
        }

        function drawWeaponIcon(x, y, weapon, isActive) {
            ctx.save();
            const accent = colorNumberToCss(weapon.color);
            ctx.translate(x, y);
            ctx.strokeStyle = isActive ? '#dfffee' : '#87928f';
            ctx.fillStyle = isActive ? accent : '#52605d';
            ctx.shadowColor = isActive ? accent : 'transparent';
            ctx.shadowBlur = isActive ? 7 : 0;
            ctx.lineWidth = 1.3;
            if (weapon.type === 'support') {
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-18, 0); ctx.lineTo(18, 0);
                ctx.moveTo(0, -18); ctx.lineTo(0, 18);
                ctx.stroke();
                ctx.fillRect(-3, -3, 6, 6);
            } else if (weapon.type === 'rocket' || weapon.type === 'missile') {
                ctx.fillRect(-15, -4, 25, 8);
                ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(17, 0); ctx.lineTo(10, 6); ctx.closePath(); ctx.fill();
                ctx.strokeRect(-17, -6, 5, 12);
            } else if (weapon.type === 'shotgun') {
                ctx.fillRect(-15, -4, 24, 8); ctx.fillRect(7, -2, 12, 4); ctx.strokeRect(-9, 4, 8, 6);
            } else if (weapon.type === 'flame') {
                ctx.fillRect(-14, -5, 20, 10); ctx.fillRect(5, -2, 11, 4);
                ctx.beginPath(); ctx.arc(18, 0, 4, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillRect(-16, -4, 25, 8); ctx.fillRect(8, -2, 12, 4); ctx.strokeRect(-8, 4, 7, 6);
            }
            ctx.restore();
        }

        function drawPlayHUD() {
            drawHudPanel(-130, 10, 220, player.damageBoostTimer > 0 ? 76 : 52, '#56eaff');
            if (bossSpawned && !bossDefeated) drawHudPanel(250, 8, 538, 70, '#ff4778');

            drawHudPanel(650, 478, 240, 110, '#5affb1');

            const margin = 200;
            let wAlpha = 0;
            if (player.x < margin) wAlpha = Math.max(wAlpha, (margin - player.x) / margin);
            if (player.x > WORLD_WIDTH - margin) wAlpha = Math.max(wAlpha, (player.x - (WORLD_WIDTH - margin)) / margin);
            if (player.y < margin) wAlpha = Math.max(wAlpha, (margin - player.y) / margin);
            if (player.y > WORLD_HEIGHT - margin) wAlpha = Math.max(wAlpha, (player.y - (WORLD_HEIGHT - margin)) / margin);

            if (wAlpha > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${wAlpha * 0.15})`;
                ctx.fillRect(UI_VIEW_LEFT, UI_VIEW_TOP, UI_VIEW_WIDTH, UI_VIEW_HEIGHT);
                ctx.fillStyle = `rgba(255, 0, 0, ${wAlpha})`;

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#300'; ctx.fillRect(-120, 35, barW, barH);
            ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : (hpRatio > 0.25 ? '#ff0' : '#f00');
            ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
            ctx.fillRect(-120, 35, barW * hpRatio, barH);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-120, 35, barW, barH);

            if (player.damageBoostTimer > 0) {

            ctx.shadowBlur = 5; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '20px "Share Tech Mono"';
            if (bossSpawned && !bossDefeated && boss) {

                const bossBarY = 42;
                const bossBarW = 494;
                const bossBarH = 18;
                ctx.font = '15px "Share Tech Mono"';
                ctx.fillStyle = '#ffe9f1';
                ctx.shadowColor = '#ff245f';
                ctx.shadowBlur = 10;
                ctx.fillText(`BOSS // ${boss.name}  [PHASE ${getBossPhase(boss)}]`, 519, 29);

                ctx.fillStyle = '#678079';

            }

            if (bossIntroTimer > 0 && bossSpawned && !bossDefeated) {
                const introAlpha = Math.min(1, bossIntroTimer / 35, (180 - bossIntroTimer) / 25);

                ctx.font = '16px "Share Tech Mono"';

            if (supportDesignation) {

                ctx.textAlign = 'center';

                ctx.font = '15px "Share Tech Mono"';

                ctx.fillStyle = 'rgba(4, 26, 34, 0.86)';

                ctx.fillStyle = colorNumberToCss(supportDesignation.weapon.color);

                ctx.strokeRect(300, 531, 200, 7);
                ctx.restore();
            }

            if (playerInFire) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffb143';
                ctx.shadowColor = '#ff3d16';
                ctx.shadowBlur = 13;
                ctx.font = '16px "Share Tech Mono"';
                ctx.fillText('BURNING // MOVE OUT OF THE FIRE', 400, 94);
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = '#0f0'; ctx.shadowColor = '#0f0'; ctx.textAlign = 'left'; ctx.font = '12px "Share Tech Mono"';
            ctx.fillText('[WASD]:移動  [左クリック]:発射  [R]:リロード  [C]:武器切り替え  [X]:ロックオン  [F]:ターゲット切り替え  [ESC/P]:ポーズ', 20, 580);

            // 武器HUDはパネル内に2行を固定配置し、文字とアイコンの基準位置を統一する。
            const weaponPanelX = 650;
            const weaponPanelY = 478;
            const rowHeight = 48;
            for (let i = 0; i < 2; i++) {
                const eq = equippedWeapons[i];
                const weapon = WEAPON_CATEGORIES[eq.c].weapons[eq.w];
                const wState = player.weaponsState[i];
                const isActive = (player.activeWeaponSlot === i);
                const rowY = weaponPanelY + 10 + i * rowHeight;

                if (isActive) {
                    ctx.fillStyle = 'rgba(45, 255, 169, 0.10)';
                    ctx.fillRect(weaponPanelX + 6, rowY - 4, 228, 42);
                    ctx.fillStyle = '#5affb1'; ctx.fillRect(weaponPanelX + 6, rowY - 4, 3, 42);
                }
                drawWeaponIcon(weaponPanelX + 30, rowY + 14, weapon, isActive);
                ctx.textAlign = 'left'; ctx.font = '11px "Share Tech Mono"';
                ctx.fillStyle = isActive ? '#eafff5' : '#96a29f';
                ctx.shadowColor = isActive ? '#4cffaa' : 'transparent'; ctx.shadowBlur = isActive ? 6 : 0;
                ctx.fillText(`[${i + 1}] ${weapon.name}`, weaponPanelX + 54, rowY + 9);
                ctx.font = '10px "Share Tech Mono"';
                if (wState.isReloading) {
                    const progress = Math.max(0, Math.min(1, 1 - (wState.reloadTimer / weapon.reloadTime)));

                    ctx.fillText(`RELOADING  ${Math.ceil(wState.reloadTimer / 60)}s`, weaponPanelX + 54, rowY + 25);
                    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(70, 20, 28, 0.9)'; ctx.fillRect(weaponPanelX + 54, rowY + 30, 172, 4);
                    ctx.fillStyle = '#ff405b'; ctx.fillRect(weaponPanelX + 54, rowY + 30, 172 * progress, 4);
                } else {
                    ctx.fillStyle = isActive ? '#7dffc2' : '#76847f'; ctx.shadowBlur = 0;
                    ctx.fillText(`AMMO ${wState.ammo} / ${weapon.maxAmmo}`, weaponPanelX + 54, rowY + 25);
                }
            }

            const mmW = 180;
            const mmH = mmW * (WORLD_HEIGHT / WORLD_WIDTH);
            const mmX = UI_BASE_WIDTH - mmW + 120; 
            const mmY = 20;
            const scaleX = mmW / WORLD_WIDTH;
            const scaleY = mmH / WORLD_HEIGHT;

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0, 20, 0, 0.6)';
            ctx.fillRect(mmX, mmY, mmW, mmH);
            ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1;
            ctx.strokeRect(mmX, mmY, mmW, mmH);

            const obstacleMinimapColors = {
                building: 'rgba(0, 100, 150, 0.5)',
                tower: 'rgba(255, 120, 40, 0.65)',
                fuel_tank: 'rgba(255, 60, 30, 0.7)',
                antenna: 'rgba(120, 200, 255, 0.6)',
                bunker: 'rgba(80, 90, 110, 0.7)',
                warehouse: 'rgba(60, 130, 170, 0.55)',
                barrier: 'rgba(140, 110, 70, 0.5)'
            };
            for (let o of obstacles) {
                ctx.fillStyle = obstacleMinimapColors[o.type] || obstacleMinimapColors.building;
                ctx.fillRect(mmX + o.x * scaleX, mmY + o.y * scaleY, o.w * scaleX, o.h * scaleY);
                if (o.hp < o.maxHp) {
                    ctx.fillStyle = 'rgba(255, 80, 40, 0.55)';
                    const dmgRatio = 1 - o.hp / o.maxHp;

            }
            
            for (let item of items) {

                const itemY = mmY + item.y * scaleY;
                ctx.fillRect(itemX - 2, itemY - 2, 4, 4);

            for (let hazard of hazards) {

                    ctx.fillStyle = 'rgba(255, 92, 25, 0.75)';

                    ctx.beginPath();
                    ctx.arc(hx, hy, Math.max(2, hazard.radius * scaleX), 0, Math.PI * 2);
                    ctx.fill();
                } else if (hazard.kind === 'fireBomb') {
                    ctx.strokeStyle = '#ffb12e';
                    ctx.beginPath();
                    ctx.arc(mmX + hazard.targetX * scaleX, mmY + hazard.targetY * scaleY, 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = '#f00'; 
            for(let e of enemies) ctx.fillRect(mmX + e.x * scaleX - 2, mmY + e.y * scaleY - 2, 4, 4);

            if (lockOnEnabled && lockedTarget) {
                const targetMapX = mmX + lockedTarget.x * scaleX;
                const targetMapY = mmY + lockedTarget.y * scaleY;
                ctx.strokeStyle = '#ff4055';
                ctx.shadowColor = '#ff1738';
                ctx.shadowBlur = 8;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(targetMapX, targetMapY, 6 + Math.sin(frameCount * 0.15), 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            
            ctx.fillStyle = '#0f0'; 
            ctx.beginPath();
            ctx.arc(mmX + player.x * scaleX, mmY + player.y * scaleY, 3, 0, Math.PI * 2);
            ctx.fill();


            if (player.pickupNoticeTimer > 0) {
                const noticeAlpha = Math.min(1, player.pickupNoticeTimer / 24);
                ctx.save();
                ctx.globalAlpha = noticeAlpha;
                ctx.textAlign = 'center';
                ctx.font = '15px "Share Tech Mono"';

                ctx.textAlign = 'center';
                ctx.fillStyle = '#eaffff';

                ctx.fillText(`WAVE ${currentWave}`, 400, 225);

                ctx.fillStyle = currentWave >= 4 ? '#ff8e96' : '#88ebff';
                ctx.fillText(config.label, 400, 254);
                ctx.restore();

            drawLockOnReticle();

            if (hitMarkerTimer > 0 || killMarkerTimer > 0) {
                const alpha = Math.min(1, Math.max(hitMarkerTimer / 6, killMarkerTimer / 12));
                const size = killMarkerTimer > 0 ? 22 : 14;
                ctx.save();
                ctx.translate(mouse.x, mouse.y);
                ctx.strokeStyle = killMarkerTimer > 0 ? `rgba(255,255,255,${alpha})` : `rgba(120,255,220,${alpha})`;
                ctx.shadowColor = killMarkerTimer > 0 ? '#ffffff' : '#63ffd0';
                ctx.shadowBlur = killMarkerTimer > 0 ? 14 : 8;
                ctx.lineWidth = killMarkerTimer > 0 ? 2.5 : 1.8;
                ctx.beginPath();
                ctx.moveTo(-size, -size); ctx.lineTo(-size * 0.45, -size * 0.45);
                ctx.moveTo(size, -size); ctx.lineTo(size * 0.45, -size * 0.45);
                ctx.moveTo(-size, size); ctx.lineTo(-size * 0.45, size * 0.45);
                ctx.moveTo(size, size); ctx.lineTo(size * 0.45, size * 0.45);
                ctx.stroke();
                ctx.restore();
            }

            if (killNoticeTimer > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, killNoticeTimer / 10);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#f4fffd';
                ctx.shadowColor = '#74ffe2';
                ctx.shadowBlur = 16;
                ctx.font = '16px "Share Tech Mono"';
                const chainText = killChain > 1 ? `TARGET DOWN  x${killChain}` : 'TARGET DOWN';
                ctx.fillText(chainText, 400, 480);
                ctx.restore();
            }

            if (!lockOnEnabled || !lockedTarget) {
                ctx.save();
                ctx.translate(mouse.x, mouse.y);
                ctx.rotate(frameCount * 0.012);
                ctx.strokeStyle = 'rgba(90, 255, 190, 0.9)';
                ctx.shadowColor = '#35ffb4';
                ctx.shadowBlur = 9;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const a = i * Math.PI / 2;
                    ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13);
                    ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 22);
                }
                ctx.stroke();
                ctx.rotate(-frameCount * 0.024);
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 1.45);
                ctx.stroke();
                ctx.fillStyle = '#d9fff0';
                ctx.fillRect(-1.5, -1.5, 3, 3);
                ctx.restore();
            }
        }

        function drawPauseMenu() {

            ctx.fillStyle = 'rgba(0, 5, 10, 0.78)';

        function drawResult() {
            const result = ranking.result;
            if (!result) return;
            const cleared = result.outcome === 'clear';
            const accent = cleared ? '#45ffbd' : '#ff7f8b';
            drawHudPanel(40, 55, 720, 490, accent);
            ctx.textAlign = 'center';
            ctx.fillStyle = accent; ctx.font = '13px "Share Tech Mono"';
            ctx.fillText('OPERATION RESULT', 400, 100);
            ctx.fillStyle = '#effff9'; ctx.font = '38px "Share Tech Mono"';
            ctx.shadowColor = accent; ctx.shadowBlur = 20;
            ctx.fillText(cleared ? 'MISSION CLEARED' : 'MISSION FAILED', 400, 158);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff'; ctx.font = '30px "Share Tech Mono"';
            ctx.fillText(`撃破数  ${result.payload.defeated_count}`, 400, 220);
            ctx.font = '15px "Share Tech Mono"';
            ctx.fillStyle = '#96d7e0';
            ctx.fillText(`装備 1  /  ${result.weapons[0].name}`, 400, 270, 650);
            ctx.fillText(`装備 2  /  ${result.weapons[1].name}`, 400, 306, 650);
            ctx.fillStyle = result.status === 'error' ? '#ff9c9c' : '#8cffe0';
            ctx.font = '16px "Share Tech Mono"';
            const statusText = result.status === 'saved' ? 'ランキングに保存しました'
                : result.status === 'error' ? '保存できませんでした' : 'ランキングに保存中…';
            ctx.fillText(statusText, 400, 368);
            ctx.fillStyle = '#a4bdc8'; ctx.font = '12px "Share Tech Mono"';
            ctx.fillText(result.status === 'error' ? result.error : '撃破数の多い順にランキングへ記録されます。', 400, 400, 650);
            if (result.status === 'error') ctx.fillText('再試行すると、同じプレイの結果を再送します。', 400, 424);
            drawMenuButton(65, 470, 210, 48, '[L] ランキング');
            drawMenuButton(295, 470, 210, 48, '[ENTER] タイトル');
            drawMenuButton(525, 470, 210, 48, '[R] 保存を再試行', result.status === 'error');
        }

        function drawMenuButton(x, y, w, h, label, enabled = true) {
            const hover = enabled && pointInRect(mouse.x, mouse.y, x, y, w, h);
            ctx.shadowBlur = 0;
            ctx.fillStyle = hover ? 'rgba(45, 190, 215, 0.28)' : 'rgba(8, 35, 48, 0.8)';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = enabled ? '#4bb6c8' : '#29404a';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = enabled ? '#c2f5ff' : '#546a73';
            ctx.textAlign = 'center';
            ctx.font = '14px "Share Tech Mono"';
            ctx.fillText(label, x + w / 2, y + h / 2 + 5);
        }

        function drawRanking() {
            const board = ranking.board;
            drawHudPanel(10, 20, 780, 550, '#55e6ff');
            ctx.textAlign = 'center';
            ctx.fillStyle = '#e2faff'; ctx.font = '30px "Share Tech Mono"';
            ctx.fillText('RANKING / TOP 10', 400, 70);
            ctx.fillStyle = '#8cbdc9'; ctx.font = '12px "Share Tech Mono"';
            ctx.fillText('撃破数順・同じ撃破数は同順位 / クリア・敗北のプレイ記録', 400, 100);
            ctx.textAlign = 'left'; ctx.fillStyle = '#62dbeb'; ctx.font = '13px "Share Tech Mono"';
            ctx.fillText('順位', 45, 139);
            ctx.fillText('撃破数', 115, 139);
            ctx.fillText('装備 1', 220, 139);
            ctx.fillText('装備 2', 495, 139);
            if (board.status === 'ready' && board.rows.length) {
                board.rows.forEach((row, index) => {
                    const y = 160 + index * 29;
                    const isOwn = row.id === ranking.result?.savedId;
                    ctx.fillStyle = isOwn ? 'rgba(40, 220, 166, 0.19)' : index % 2 === 0 ? 'rgba(50, 110, 140, 0.12)' : 'rgba(0, 0, 0, 0)';
                    ctx.fillRect(30, y - 4, 740, 28);
                    ctx.fillStyle = isOwn ? '#8fffd5' : '#def0f6';
                    ctx.font = '13px "Share Tech Mono"';
                    ctx.textAlign = 'left';
                    ctx.fillText(String(row.rank), 45, y + 15);
                    ctx.fillText(String(row.defeated_count), 115, y + 15, 90);
                    ctx.fillText(row.weapon_1_name, 220, y + 15, 255);
                    ctx.fillText(row.weapon_2_name, 495, y + 15, 255);
                });
            } else {
                ctx.textAlign = 'center'; ctx.font = '16px "Share Tech Mono"';
                ctx.fillStyle = board.status === 'error' ? '#ff9c9c' : '#b7dae3';
                const text = board.status === 'loading' ? 'ランキングを読み込み中…'
                    : board.status === 'error' ? board.error : 'まだ記録がありません。最初の出撃に挑戦しましょう。';
                ctx.fillText(text, 400, 285, 700);
            }
            ctx.textAlign = 'center'; ctx.font = '12px "Share Tech Mono"';
            ctx.fillStyle = '#92bec6';
            const unsaved = rankingReturnScene === SCENE.RESULT && ranking.result?.status === 'error';
            ctx.fillText(unsaved ? '今回の結果は未保存です。結果画面から保存を再試行できます。'
                : '同順位の記録は登録順に表示 / 緑色の行は今回の記録', 400, 481);
            drawMenuButton(140, 510, 240, 44, '[ENTER / ESC] 戻る');
            drawMenuButton(420, 510, 240, 44, '[R] 更新', board.status !== 'loading');
        }

        // =========================================================
        // 固定タイムステップ
        //
        // requestAnimationFrameの呼び出し回数は、モニターのリフレッシュレートに依存する。
        // そのまま毎回update()すると、120Hz/144Hz環境ではゲーム速度も約2倍になる。
        // ゲームロジックは常に60回/秒で更新し、PCごとの速度差を防ぐ。
        // =========================================================
        const FIXED_FPS = 60;
        const FIXED_FRAME_TIME = 1000 / FIXED_FPS;
        const MAX_FRAME_DELTA = FIXED_FRAME_TIME * 5;

        let previousFrameTime = null;
        let fixedFrameAccumulator = 0;

        function gameLoop(currentTime) {
            if (previousFrameTime === null) {
                previousFrameTime = currentTime;
            }

            // タブ復帰時などに、停止中の時間を一気に消化しないよう上限を設ける。
            const elapsedTime = Math.min(currentTime - previousFrameTime, MAX_FRAME_DELTA);
            previousFrameTime = currentTime;
            fixedFrameAccumulator += elapsedTime;

            let didUpdate = false;
            while (fixedFrameAccumulator >= FIXED_FRAME_TIME) {
                update();
                fixedFrameAccumulator -= FIXED_FRAME_TIME;
                didUpdate = true;

                // クリック入力はupdate()が受け取るまで保持し、処理後に解除する。
                isClicked = false;
            }

            // 実際の描画も60FPSに制限する。
            if (didUpdate) {
                draw();
            }

            requestAnimationFrame(gameLoop);
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                previousFrameTime = null;
                fixedFrameAccumulator = 0;
            }
        });

        window.onload = init;

    </script>
</body>
</html>
